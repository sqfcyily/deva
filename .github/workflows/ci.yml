# PR 与推到 main 时做类型检查 + 构建，挡住编不过的改动。打包与发版仍由 release.yml 负责。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: node --test apps/desktop/test/node-session-storage.test.mjs

      - run: pnpm build

      - run: pnpm --filter @deva/desktop build:headless && node --test apps/desktop/test/headless-chat.test.mjs

      - name: Verify a text conversation across two native amd64 Compose containers
        timeout-minutes: 12
        env:
          DEVA_PORT: '18794'
          DEVA_ORIGIN: http://127.0.0.1:18794
          DEVA_MODEL_BASE_URL: http://127.0.0.1:18795/v1
          DEVA_MODEL: deva-compose-fixture
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          export COMPOSE_PROJECT_NAME="deva-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DEVA_WEB_TOKEN=$(openssl rand -hex 32); export DEVA_WEB_TOKEN
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --wait --wait-timeout 90
          curl -fsS "$DEVA_ORIGIN/healthz"
          first=$(docker compose ps -q deva)
          sid=$(docker compose exec -T deva node --input-type=module < apps/desktop/test/headless-compose-probe.mjs)
          docker compose up --force-recreate --wait --wait-timeout 90
          second=$(docker compose ps -q deva)
          test -n "$first" && test -n "$second" && test "$first" != "$second"
          docker compose exec -T -e DEVA_SMOKE_SESSION="$sid" deva node --input-type=module < apps/desktop/test/headless-compose-probe.mjs
