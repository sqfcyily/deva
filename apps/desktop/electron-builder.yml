appId: dev.sqfcy.deva
productName: Deva
copyright: Copyright © 2026 sqfcy

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

# 让最终安装包自带运行时，用户双击安装后即可启动，无需任何环境配置
asar: true

# Electron 二进制走国内镜像，避免打包时卡在下载
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  # 默认名带空格（Deva Setup x.y.z.exe），传到 GitHub Release 会被改成点号，这里统一成连字符
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deva

# MSI 供企业部署（组策略 / Intune / msiexec 静默装）用；默认 --win 只出 nsis，要 MSI 走 build:win:msi 或显式 --win msi。
# 注意 MSI 只继承 win 段、不读 nsis 段，所以安装选项要在这里再写一遍
msi:
  artifactName: ${productName}-${version}.${ext}
  # 升级码决定新版能否原地替换旧版，一旦发出去就不能再改；这里钉死成 electron-builder 按 appId 派生的默认值，
  # 免得以后改 appId / productName 时悄悄换掉，导致新旧两版并存
  upgradeCode: C4A1F9D9-7483-513E-A3A9-7D90BCAFF6AF
  # 向导式安装：可选「仅当前用户 / 所有用户」与安装目录，与 nsis 行为对齐
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deva

mac:
  target:
    - dmg
  # 1024×1024 png，electron-builder 自动转 icns
  icon: build/icon.png
  category: public.app-category.developer-tools

dmg:
  # 文件名带架构，arm64 / x64 两个包才不会重名
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
