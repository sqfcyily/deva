appId: dev.sqfcy.deva
productName: Deva
copyright: Copyright © 2026 sqfcy

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

# 让最终安装包自带运行时，用户双击安装后即可启动，无需任何环境配置
asar: true

# Electron 二进制走国内镜像，避免打包时卡在下载
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  # 默认名带空格（Deva Setup x.y.z.exe），传到 GitHub Release 会被改成点号，这里统一成连字符
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deva

mac:
  target:
    - dmg
  # 1024×1024 png，electron-builder 自动转 icns
  icon: build/icon.png
  category: public.app-category.developer-tools

dmg:
  # 文件名带架构，arm64 / x64 两个包才不会重名
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
