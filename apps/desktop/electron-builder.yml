appId: dev.sqfcy.deva
productName: Deva
copyright: Copyright © 2026 sqfcy

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  # 依赖里的文档、类型声明、sourcemap 与测试/示例目录运行时用不到
  - "!**/node_modules/**/*.{md,markdown,map,d.ts,d.mts,d.cts,ts.map}"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples,.github}/**"

# 只保留中英文的 Chromium 语言包（locales/*.pak，影响右键菜单、原生对话框等内置文案）；其余语言回退到 en-US。
# 注意 navigator.language 也取自实际加载的语言包：缺 zh-TW 的话繁体系统（含 zh-HK）会被当成 en-US，
# 渲染层 i18n 就不会默认中文了
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

# 让最终安装包自带运行时，用户双击安装后即可启动，无需任何环境配置
asar: true

# mac 包做 ad-hoc 签名（免费、无证书）；Linux 把可执行文件换成补 Wayland 参数的启动脚本。见各脚本内说明
afterPack: ./scripts/after-pack.cjs

# Windows 便携版 zip 套一层 Deva\ 目录（electron-builder 默认把文件直接放在压缩包根目录），见脚本内说明
afterAllArtifactBuild: ./scripts/portable-zip.cjs

# Electron 二进制走国内镜像，避免打包时卡在下载
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  # nsis = 安装包；zip = 便携版（解压后直接运行 Deva.exe，数据同样在 ~/.deva，与安装版共用）
  target:
    - nsis
    - zip
  # 只有 zip 用到这个名字：nsis 段自己的 artifactName 优先
  artifactName: ${productName}-${version}-portable.${ext}
  icon: build/icon.ico
  # 「检查更新」的下载源（electron-updater 读这里）：打包时据此生成 latest.yml 与安装目录里的 app-update.yml，
  # 实际上传由 CI 的 release job 完成。只挂在 win 段——mac 不走自动更新
  publish:
    provider: github
    owner: sqfcyily
    repo: deva

nsis:
  # 默认名带空格（Deva Setup x.y.z.exe），传到 GitHub Release 会被改成点号，这里统一成连字符
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  # 自定义安装目录后会检测写入权限，见 build/installer.nsh（electron-builder 自动引入）
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deva

mac:
  target:
    - dmg
  # 1024×1024 png，electron-builder 自动转 icns。按 macOS 图标网格四周留透明边距（底板 824 居中），
  # 不能用满幅的 icon.png，否则 Dock 里比其它应用大一圈（issue #37）；由 scripts/gen-icon.mjs 生成
  icon: build/icon-mac.png
  category: public.app-category.developer-tools

dmg:
  # 文件名带架构，arm64 / x64 两个包才不会重名
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  # AppImage = 任意发行版下载即用；deb = Debian / Ubuntu 系安装包（菜单入口、/usr/bin/deva，Ubuntu 24+ 的 AppArmor 配置）
  target:
    - AppImage
    - deb
  category: Development
  # deb 必填（默认取 package.json 的 author，但那里没有邮箱）；用 GitHub 的 noreply 地址，不在包里暴露真实邮箱
  maintainer: sqfcy <38500955+sqfcyily@users.noreply.github.com>
  # 可执行文件名默认取 package.json 的 name（@deva/desktop → @devadesktop），带 @ 与 / 无法用于文件路径，
  # AppImage 打包会直接失败；显式给一个干净的名字。
  executableName: deva
  # 各尺寸 png 目录（NxN.png，由 build/icon.png 缩放而来）：给单张 1024 的 png 时只会装进 hicolor/1024x1024，
  # 启动器 / 图标主题常按 48~256 找图标，找不到就显示占位图
  icon: build/icons
  # 让 .desktop 文件名与 Electron 的 app_id / WM_CLASS 对齐，任务栏才能把窗口归到 Deva 图标下
  # （desktopName 本身在 apps/desktop/package.json 里）
  syncDesktopName: true
  # 文件名带架构，以后加 arm64 也不会重名（electron-builder 按格式换架构名：AppImage 是 x86_64，deb 是 amd64）
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  # 包名默认取 package.json 的 name（@deva/desktop），装好后得 apt remove 一个奇怪的名字；统一叫 deva
  packageName: deva
  # 默认的 AppArmor 配置只放行 /opt/Deva/deva，而那已被换成启动脚本（见 scripts/linux-launcher.cjs），
  # 真正的 Electron 是 deva-bin；不放行它的话 Ubuntu 24+ 上沙箱建不起来、应用直接打不开。见模板内说明
  appArmorProfile: build/linux/apparmor-profile.tpl
