      async function avatarData(pid) {
        if (!pid) return null
        if (avatarCache.has(pid)) return avatarCache.get(pid)
        if (avatarRequests.has(pid)) return avatarRequests.get(pid)
        const request = fetchAvatarData(pid)
        avatarRequests.set(pid, request)
        try { return await request } finally { avatarRequests.delete(pid) }
      }

      async function fetchAvatarData(pid) {
        const persona = S.personas.find((p) => p.id === pid)
        if (persona?.image) {
          avatarCache.set(pid, persona.image)
          return persona.image
        }
        try {
          const r = await fetch('/api/avatar?name=' + encodeURIComponent(pid))
          if (!r.ok) throw new Error('miss')
          const ct = r.headers.get('content-type') || ''
          const v = ct.includes('json') ? await r.json() : await r.text()
          avatarCache.set(pid, v)
          return v
        } catch {
          avatarCache.set(pid, null)
          return null
        }
      }

      /** 一枚头像的 HTML。busy = 该角色正在生成，底板变星芒。 */
      function avatarHtml(pid, { busy = false, done = false, size = '' } = {}) {
        const data = avatarCache.get(pid)
        const style = size ? ` style="--sz:${size}"` : ''
        const dot = done && !busy ? '<i class="ava__dot" aria-label="有未读完成消息"></i>' : ''
        return `<span class="ava${busy ? ' is-busy' : ''}" data-persona="${esc(pid)}"${style}>${data ? avatarMarkup(data, busy) : esc((personaName(pid) || 'D').slice(0, 1))}${dot}</span>`
      }

      /** 异步把页面上还没取到头像的占位补上。 */
      async function hydrateAvatars() {
        const nodes = [...document.querySelectorAll('.ava[data-persona]')].filter(
          (n) => !n.dataset.done
        )
        let changed = false
        for (const node of nodes) {
          const pid = node.dataset.persona
          if (avatarCache.has(pid) === false) {
            await avatarData(pid)
          }
          const data = avatarCache.get(pid)
          if (!data) {
            node.dataset.done = '1'
            continue
          }
          const busy = node.classList.contains('is-busy')
          const dot = node.querySelector('.ava__dot')
          node.innerHTML = avatarMarkup(data, busy)
          if (dot) node.appendChild(dot)
          node.dataset.done = '1'
          changed = true
        }
        return changed
      }

      // ───────── 渲染对话 ─────────
      /**
       * 渲染块只认三种：text / notice / error（对齐 remote/types.ts 的 TurnBlock）。
       * 工具调用不单独成块——它的过程在状态行里显示，落定后不留痕；
       * 待办清单是会话级数据、不属于任何回合，手机端不展示。
       * 卡片（问答 / 计划 / 挂载）不在块里，由 cardHtml 按状态单独渲染。
       */
      function blockHtml(b) {
        let inner = ''
        if (b.kind === 'thinking') inner = `<div class="notice"><b>思考</b><div class="md">${renderMd(b.text || '')}</div></div>`
        else if (b.kind === 'tool' || b.kind === 'subagent') {
          const label = toolLabel(b.name || b.agent || '子智能体', b.args)
          inner = `<div class="fold__line"><b>${esc(label.name)}</b><span>${esc(b.summary || label.arg || '')} · ${esc(b.status || 'running')}</span></div>`
          if (b.blocks) inner += b.blocks.map(blockHtml).join('')
        } else if (b.kind === 'todolist') {
          inner = `<div class="notice"><b>${esc(b.title || '待办清单')}</b>${(b.items || []).map(x => `<div>${x.status === 'done' || x.completed ? '✓' : '•'} ${esc(x.text || x.title || x.content || '')}</div>`).join('')}</div>`
        } else if (b.kind === 'insert') inner = `<div class="notice">${esc(b.text || b.content || '')}</div>`
        if (inner) return `<div class="blk">${inner}</div>`
        switch (b.kind) {
          case 'text':
            inner = `<div class="msg__content md">${renderMd(b.text)}</div>`
            break
          case 'notice':
            inner = `<div class="notice">${esc(b.text || b.code || '')}</div>`
            break
          case 'error':
            inner = `<div class="notice notice--error">${esc(b.text || b.message || '出错')}</div>`
            break
          case 'compaction':
            inner = '<div class="notice">较早的历史已压缩</div>'
            break
          default:
            inner = ['ask', 'plan', 'mount'].includes(b.kind)
              ? cardHtml(isPinnedBlock(b) ? { ...b, key: b.key || b.id, state: 'open' } : b) : ''
        }
        // 每块各占一行，靠父容器 gap 拉开距离——否则卡片会和后面的正文粘在一起
        return inner ? `<div class="blk">${inner}</div>` : ''
      }

      /** 用户消息里的附件：图片直接显示缩略图（点开看原图），其它类型给文件名。 */
      function userAttachmentsHtml(atts) {
        if (!atts || !atts.length) return ''
        const parts = atts.map((a, i) => {
          const isImage = a.kind === 'image' && a.ref
          if (isImage) {
            const src = `/api/message-image?sid=${encodeURIComponent(S.sessionId)}&ref=${encodeURIComponent(a.ref)}&key=${encodeURIComponent(GATEWAY_KEY)}`
            const full = src + '&full=1'
            // 站内全屏查看，不跳新标签页（手机上跳走就回不来了）
            return `<button class="attach__img" type="button" data-img="${esc(src)}&full=1" title="${esc(a.name || '查看大图')}">
              <img src="${esc(src)}" alt="${esc(a.name || '图片')}" decoding="async">
            </button>`
          }
          return `<span class="attach__item">▤ ${esc(a.name || '附件')}${
            a.size ? `<span style="opacity:.6">${fmtSize(a.size)}</span>` : ''
          }</span>`
        })
        return `<div class="attach">${parts.join('')}</div>`
      }

      function messageHtml(m) {
        if (m.role === 'user') {
          const atts = userAttachmentsHtml(m.attachments)
          if (m.notify) {
            return `<div class="msg msg--agent"><div class="notice">${esc(m.text)}</div></div>`
          }
          // 纯附件消息没有正文：别渲染一个空气泡把宽度挤掉
          const bubble = m.text && m.text.trim()
            ? `<div class="bubble--user">${esc(m.text)}</div>` : ''
          return `<div class="msg msg--user"><div class="turn">${bubble}${atts}</div></div>`
        }
        // 助手消息：左边挂角色头像 + 名字，一眼分清是谁在说话
        const pid = personaOf(S.sessionId)
        const pname = personaName(pid)
        const avatar = pid ? avatarHtml(pid, { busy: false }) : ''
        const body = assistantBody(m.blocks || [], {
          open: false,
          durationMs: m.durationMs,
          foldKey: m.foldKey || `message:${S.messages.indexOf(m)}`,
          sessionId: S.sessionId,
          lead: pname
        })
        return `<div class="msg msg--agent">${avatar}<div class="msg__body">${body}</div></div>`
      }

      function liveHtml() {
        if (!S.live) return ''
        const L = ensureLive()
        const pid = personaOf(S.sessionId)
        const pname = personaName(pid)
        const avatar = pid ? avatarHtml(pid, { busy: false }) : ''
        // 当前步骤（照桌面端 currentSteps）：运行中的工具一并列出，收在折叠条下方
        const current = currentSteps(liveBlocks(L))
        const blocks = liveBlocks(L)
        let inner = assistantBody(blocks, {
          open: true, sessionId: S.sessionId, foldKey: L.foldKey,
          startedAt: L.startedAt, lead: pname, current
        })
        // 最后一段正文打上标记：后续 text_delta 只替换它的内容（patchLiveText），不重建整条时间线
        const lastText = [...blocks].reverse().find(b => b.kind === 'text')
        if (lastText) {
          const marker = `<div data-live-text="1">${blockHtml(lastText)}</div>`
          // assistantBody 里正文可能出现一次（作为 visible 的一部分），这里做一次就地替换
          const rendered = blockHtml(lastText)
          if (inner.includes(rendered)) inner = inner.replace(rendered, marker)
        }
        // thinking 阶段：标题已是「思考中」，下面只露当前步骤行；工具阶段 spinner 行即当前步骤。
        if (L.status && !current.some(b => b.kind === 'tool' || b.kind === 'subagent')) {
          inner += `<div class="status"><span class="spin"></span><span>${esc(L.status)}</span></div>`
        }
        return `<div class="msg msg--agent">${avatar}<div class="msg__body">${inner}</div></div>`
      }

      function renderThread() {
        const root = $('#threadInner')
        const sameSession = root.dataset.renderSession === String(S.sessionId)
        const oldCards = new Map(sameSession ? [...root.querySelectorAll('.card[data-key]')].map(c => [c.dataset.key, c]) : [])
        const focused = sameSession && root.contains(document.activeElement) ? document.activeElement : null
        const selection = focused && typeof focused.selectionStart === 'number' ? [focused.selectionStart, focused.selectionEnd] : null
        const folds = threadFoldState()
        if (sameSession) for (const node of root.querySelectorAll('.fold[data-fold-key]')) folds.set(node.dataset.foldKey, node.classList.contains('is-open'))
        const knownDeliveries = new Set()
        for (const m of S.messages) for (const b of m.blocks || []) {
          if (b.kind === 'tool' && b.name === 'present_files') knownDeliveries.add(b.id)
        }
        if (S.live) for (const b of ensureLive().blocks) {
          if (b.kind === 'tool' && b.name === 'present_files') knownDeliveries.add(b.id)
        }
        // 老版本历史可能只保留会话级交付引用；补在末尾，实际文件仍由 inspect API 授权。
        let extraFiles = ''
        for (const ref of S.deliverables || []) {
          const id = ref.toolUseId || ref.tool
          if (!id || knownDeliveries.has(id) || (ref.status != null && ref.status !== 'ok')) continue
          knownDeliveries.add(id)
          extraFiles += filesHtml([], S.sessionId, id)
        }
        const h = S.messages.map(messageHtml).join('') + liveHtml() + extraFiles
        root.innerHTML = h || '<div class="empty">还没有消息<br>交代一个目标开始吧</div>'
        root.dataset.renderSession = String(S.sessionId)
        // 复用仍未决的卡，连同输入、选择、按钮请求状态和原有事件处理一起保留。
        const newCards = [...root.querySelectorAll('.card[data-key]')]
        bindCards()
        for (const node of newCards) {
          const old = oldCards.get(node.dataset.key)
          if (old && old.dataset.card === node.dataset.card) node.replaceWith(old)
        }
        if (focused && root.contains(focused)) {
          focused.focus({ preventScroll: true })
          if (selection) focused.setSelectionRange(...selection)
        }
        bindFolds()
        bindFiles()
        hydrateAvatars()
        renderComposer()
        tickProcessTime()
        $('#jumpBtn').classList.toggle('is-open', !S.stickBottom)
      }

      /**
       * 输入区两颗按钮的状态（都按「当前会话」的真实 turnId 算）。
       *
       *  - 运行中：左边停止键独立出现（红方块），右边发送键变成「插入」——不再是同一颗键
       *    换皮肤；点发送键永远不会停止一轮，点停止键也永远不会插入或发送。
       *  - 空闲：只有发送键。
       */
      /**
       * 输入区按钮：照抄桌面端的规则——**只有一枚键**，位置固定不跳动。
       *
       *   空闲                → 发送（发新消息）
       *   流式中 + 输入框有字 → 发送（实为插入当前轮，排队到下一步交给模型）
       *   流式中 + 输入框为空 → 停止（红色方块）
       *
       * 也就是「要停止就先清空输入框」，这是桌面端刻意的设计，避免用户想补话时误触停止。
       * 文案取自 i18n messages.ts 的 cf.insert.*。
       */
      function renderComposer() {
        const send = $('#sendBtn')
        const input = $('#input')
        if (!send || !input) return
        const running = !!S.turnId
        const hasText = !!input.value.trim()
        const canInsert = running && hasText
        const stopMode = running && !hasText

        send.classList.toggle('send--stop', stopMode)
        send.classList.toggle('send--insert', canInsert)
        send.disabled = !!S.__stopping && stopMode
        // 发送是文字按钮（照桌面端）；停止态换成方块图标
        send.innerHTML = stopMode ? '<i class="send__stopicon"></i>' : '发送'
        send.setAttribute(
          'aria-label',
          stopMode ? '停止当前轮' : canInsert ? '插入到当前轮' : '发送'
        )
        send.title = stopMode
          ? '停止当前轮（想补充内容就先在输入框写点什么）'
          : canInsert
            ? '插入当前轮：当前步骤结束后交给 Deva，来不及就在本轮结束后发出'
            : '发送'

        // 待插入胶囊：有排队内容时显示「待插入 · 原文 +N」，可撤回
        const chip = $('#insertChip')
        if (chip) {
          const list = running ? S.inserts || [] : []
          chip.hidden = list.length === 0
          if (list.length) {
            const last = list[list.length - 1]
            const more = list.length > 1 ? ` +${list.length - 1}` : ''
            chip.innerHTML =
              `<span class="chip__pending">待插入</span>` +
              `<span class="chip__pendingtext">${esc(last)}${esc(more)}</span>` +
              `<button class="chip__withdraw" type="button" id="insertWithdraw">撤回</button>`
            chip.title = list.join('\n')
            const wd = $('#insertWithdraw')
            if (wd) wd.onclick = (e) => { e.stopPropagation(); withdrawInserts() }
          }
        }

        input.placeholder = running
          ? '补充或纠正，当前步骤结束后交给 Deva…'
          : '交代一个目标，或 @角色 / /命令'

        // 思考强度与挂载区文字（照桌面端：模型 · 思考强度）
        const eff = $('#effortText')
        if (eff) {
          eff.textContent = effortLabel(effectiveEffort())
        }
        setFocusChip(S.meta?.focusRoot)
      }

      /** 撤回本轮还没送达的插入（桌面端 chat.withdrawInserts，原文还回输入框）。 */
      async function withdrawInserts() {
        try {
          const r = await api('/api/withdraw-inserts', { sessionId: S.sessionId })
          S.inserts = []
          const input = $('#input')
          if (r && r.text && input) {
            input.value = input.value.trim() ? r.text + ' ' + input.value : r.text
            autoGrow()
          }
          renderComposer()
          toast('已撤回')
        } catch (e) {
          toast(e.message)
        }
      }

      /**
       * 处理过程折叠条。
       *
       * 桌面端把「思考 + 工具调用」收进一条可折叠的过程里，只留最后那段回答在外面；
       * 这里照做：进行中显示「处理中 · N 步」，结束后「已处理 X 秒 · N 步」
       * （文案沿用 Deva 的 messages.ts process.*）。默认收起，点开才看细节。
       */
      function processLabel(open, steps, durationMs, startedAt) {
        // 与桌面端一致：只数顶层工具、子智能体、问答及计划，不把正文/思考算作一步。
        const n = steps.filter(b => ['tool', 'subagent', 'ask', 'plan'].includes(b.kind)).length
        const count = n ? ` · ${n} 步` : ''
        const onlyThinking = steps.length === 1 && steps[0].kind === 'thinking'
        if (open) {
          const last = steps.at(-1)
          const title = last?.kind === 'thinking' ? '思考中' : '处理中'
          const elapsed = Math.max(0, Math.floor((Date.now() - startedAt) / 1000))
          return `${title}${count} · ${fmtDuration(elapsed * 1000)}`
        }
        if (Number.isFinite(durationMs) && durationMs > 0)
          return `${onlyThinking ? '已思考' : '已处理'} ${fmtDuration(Math.max(1000, durationMs))}${onlyThinking ? '' : count}`
        return n ? `已执行 ${n} 步` : '已思考'
      }

      function processLabelHtml(open, steps, durationMs, startedAt) {
        const label = processLabel(open, steps, durationMs, startedAt)
        return `<span class="process-time"${open ? ' data-live-process="1"' : ''}>${esc(label)}</span>`
      }

      function foldHtml(open, steps, durationMs, foldKey = '', lead = '', startedAt = 0) {
        const expanded = threadFoldState().get(foldKey) === true
        const label = processLabelHtml(open, steps, durationMs, startedAt)
        return `<div class="fold${expanded ? ' is-open' : ''}" data-fold-key="${esc(foldKey)}">
          <div class="process-row">
            ${lead ? `<span class="msg__name">${esc(lead)}</span>` : ''}
            <button class="fold__head" type="button" aria-expanded="${expanded}">
              ${label}<svg class="fold__caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
            </button>
          </div>
          <div class="fold__body">${steps.map(s => s.kind ? blockHtml(s) : `<div class="fold__line"><b>${esc(s.name || '工具')}</b><span>${esc(s.arg || '')}</span></div>`).join('')}</div>
        </div>`
      }

      /**
       * 运行中每秒刷新一次「处理中 · N 步 · 1 分 2 秒」。
       *
       * 只改那一个 span 的文字，不重绘整条对话——重绘会冲掉问答卡里没提交的输入。
       * 计时锚点用主进程的起轮时间，切走再回来也接着算，不归零。
       */
      let processTimer = null
      function tickProcessTime() {
        const node = document.querySelector('#threadInner [data-live-process]')
        if (!S.turnId || !node || !S.live) {
          if (processTimer) { clearInterval(processTimer); processTimer = null }
          return
        }
        const paint = () => {
          const el = document.querySelector('#threadInner [data-live-process]')
          if (!el || !S.live) return
          const L = ensureLive()
          el.textContent = processLabel(true, liveBlocks(L), 0, L.startedAt || Date.now())
        }
        paint()
        if (!processTimer) processTimer = setInterval(paint, 1000)
      }

      function threadFoldState() {        if (S.__foldSession !== S.sessionId) {
          S.__foldSession = S.sessionId
          S.__foldState = new Map()
        }
        return S.__foldState || (S.__foldState = new Map())
      }

      function isPinnedBlock(b) {
        if (['error', 'notice', 'compaction', 'agentcard', 'autotaskcard'].includes(b.kind)) return true
        if (['ask', 'plan', 'mount'].includes(b.kind)) {
          if (b.state) return b.state === 'open'
          if (b.kind === 'ask') return b.answers === undefined
          if (b.kind === 'plan') return !b.decided && !Object.prototype.hasOwnProperty.call(b, 'decision')
          return !b.decided && !Object.prototype.hasOwnProperty.call(b, 'root') && !Object.prototype.hasOwnProperty.call(b, 'mounted')
        }
        return false
      }

      function isProcessBlock(b) {
        return !isPinnedBlock(b) && ['tool', 'thinking', 'subagent', 'todolist', 'insert', 'ask', 'plan', 'mount'].includes(b.kind)
      }

      function liveBlocks(L) {
        const cards = new Map([...L.cards, ...L.historyCards].map(c => [c.key || c.id, c]))
        const used = new Set()
        const blocks = L.blocks.map(b => {
          if (!['ask', 'plan', 'mount'].includes(b.kind)) return b
          const key = b.key || b.id
          used.add(key)
          return cards.get(key) || b
        })
        for (const [key, card] of cards) if (!used.has(key)) blocks.push(card)
        if (L.error && !blocks.some(b => b.kind === 'error' && (b.text || b.message) === L.error)) blocks.push({ kind: 'error', text: L.error })
        return blocks
      }

      function fmtDuration(ms) {
        const s = Math.round(ms / 1000)
        if (s < 60) return `${s} 秒`
        const h = Math.floor(s / 3600)
        const m = Math.floor((s % 3600) / 60)
        const rest = s % 60
        if (h) return `${h} 小时 ${m} 分 ${rest} 秒`
        return `${m} 分 ${rest} 秒`
      }

      /**
       * 一条助手消息：过程（折叠）+ 回答 + 交付文件。
       * 过程里收的是思考与工具调用；回答是最后那段正文——这就是桌面端「折叠后只留回答」的读法。
       */
      /**
       * 当前正在进行的步骤（照桌面端 currentSteps）：
       * 有正在运行的工具/子智能体 → 全部列出（并行执行的一起露，最多 5 行）；
       * 没有运行中的 → 露最后一个过程步骤；若它后面已经在出正文或卡片，则不露。
       */
      function currentSteps(blocks) {
        const steps = blocks.filter(isProcessBlock)
        const running = steps.filter(b => (b.kind === 'tool' || b.kind === 'subagent') && b.status === 'running')
        if (running.length) return running
        const last = steps[steps.length - 1]
        if (!last) return []
        const after = blocks.slice(blocks.indexOf(last) + 1)
        return after.some(b => b.kind !== 'step' && (b.kind !== 'text' || (b.text || '').trim())) ? [] : [last]
      }

      /** 折叠条下方的「当前步骤」行（照桌面端 preview）：带 spinner、最多 5 行。 */
      function currentStepHtml(current) {
        if (!current || !current.length) return ''
        return current
          .filter(b => b.kind !== 'thinking')
          .slice(0, 5)
          .map(b => {
            const label = toolLabel(b.name, b.args)
            return `<div class="status"><span class="spin"></span><span>${esc(
              label.arg ? `${label.name} · ${label.arg}` : label.name
            )}</span></div>`
          })
          .join('')
      }

      function assistantBody(blocks, { open = false, durationMs = 0, sessionId = '', foldKey = '', lead = '', startedAt = 0, current = null } = {}) {
        const deliveries = blocks.filter(b => b.kind === 'tool' && b.name === 'present_files' && b.status === 'ok')
        let last = -1
        blocks.forEach((b, i) => { if (isProcessBlock(b)) last = i })
        const process = [], visible = []
        blocks.forEach((b, i) => (i <= last && !isPinnedBlock(b) ? process : visible).push(b))
        const hasVisible = deliveries.length || visible.some(b => b.kind !== 'step' && (b.kind !== 'text' || (b.text || '').trim()))
        let h = last >= 0 && (open || hasVisible)
          ? foldHtml(open, process, durationMs, foldKey, lead, startedAt) + visible.map(blockHtml).join('')
          : blocks.map(blockHtml).join('')
        if (last < 0 && lead) h = `<div class="process-row"><span class="msg__name">${esc(lead)}</span></div>` + h
        // 运行中：折叠条下方露出当前步骤（桌面端 preview 的做法），带 spinner
        if (open && current && current.length) h += currentStepHtml(current)
        if (!open) for (const tool of deliveries) {
          const args = tool.args && typeof tool.args === 'object' ? tool.args : {}
          const paths = Array.isArray(args.paths) ? args.paths : []
          const files = paths.map((path, index) => ({ name: String(path).split(/[\\/]/).pop(), toolUseId: tool.id, index }))
          h += filesHtml(files, sessionId, tool.id)
        }
        return h
      }

      // ───────── 交付文件 ─────────
      // 模型用 present_files 交出来的文件。手机端要能看到、并且点开看内容。
      // 路径不在这里拼：一律回服务端按「会话 + 工具调用」查，由 Deva 确认这个文件确实是它交付的。
      function filesHtml(files, sessionId, toolId = '') {
        const rows = files.map((f, i) => {
          const name = f.name || String(f.path || '').split(/[\\/]/).pop() || '交付文件'
          const ext = (name.split('.').pop() || '?').toUpperCase().slice(0, 5)
          const gone = f.size === null
          return `<div class="filerow" role="button" tabindex="0" data-sid="${esc(sessionId)}" data-tool="${esc(f.toolUseId || toolId)}" data-i="${f.index ?? i}">
            <span class="filerow__ico">${esc(ext)}</span><span class="filerow__body">
            <span class="filerow__name">${esc(name)}</span>
            <span class="filerow__meta${gone ? ' filerow__gone' : ''}">${gone ? '文件已不存在' : typeof f.size === 'number' ? fmtSize(f.size) : '点击预览或下载'}</span></span></div>`
        }).join('')
        return `<div class="files" data-files-sid="${esc(sessionId)}" data-files-tool="${esc(toolId || files[0]?.toolUseId || '')}"><div class="files__head">交付文件 · ${files.length}</div>${rows}</div>`
      }

      function bindFiles() {
        const bind = root => {
          for (const row of root.querySelectorAll('.filerow[data-tool]')) {
            row.onclick = () => openViewer(row.dataset.sid, row.dataset.tool, Number(row.dataset.i))
            row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click() } }
          }
        }
        bind(document)
        for (const group of document.querySelectorAll('.files[data-files-tool]')) {
          if (group.dataset.loading || !group.dataset.filesTool) continue
          group.dataset.loading = '1'
          const sid = group.dataset.filesSid, tool = group.dataset.filesTool
          const cache = S.__fileLists || (S.__fileLists = new Map())
          const key = JSON.stringify([sid, tool])
          if (!cache.has(key)) cache.set(key, api(`/api/deliverables?sid=${encodeURIComponent(sid)}&tool=${encodeURIComponent(tool)}`).then(list => {
            if (!Array.isArray(list)) throw new Error('交付文件信息格式异常')
            return list
          }).catch(error => { cache.delete(key); throw error }))
          cache.get(key).then(list => {
            if (!group.isConnected) return
            const holder = document.createElement('div')
            holder.innerHTML = filesHtml(list.map((f, index) => ({ ...f, index, toolUseId: tool })), sid, tool)
            group.innerHTML = holder.firstElementChild.innerHTML
            bind(group)
          }).catch(() => { if (group.isConnected) delete group.dataset.loading })
        }
      }

      async function openViewer(sid, tool, index) {
        if (!Number.isInteger(index) || index < 0) return
        const token = S.__viewerToken = (S.__viewerToken || 0) + 1
        const q = `sid=${encodeURIComponent(sid)}&tool=${encodeURIComponent(tool)}&i=${index}`
        const raw = '/api/deliverable-raw?' + q
        const download = `<div class="viewer__note"><a href="${esc(raw + '&download=1')}" download>下载原文件</a></div>`
        $('#viewerTitle').textContent = '载入中…'
        $('#viewerBody').innerHTML = download + '<div class="viewer__note">载入中…</div>'
        openSheet('#viewer')
        try {
          const r = await api('/api/deliverable-content?' + q)
          if (token !== S.__viewerToken) return
          $('#viewerTitle').textContent = (r.name || '交付文件') + (typeof r.size === 'number' ? ' · ' + fmtSize(r.size) : '')
          let content
          if (r.kind === 'text') {
            content = `<pre class="viewer__pre">${esc(r.text || '')}</pre>` +
              (r.truncated ? '<div class="viewer__note">内容较长，当前为部分预览；下载可查看完整内容。</div>' : '')
          } else if (r.kind === 'image') {
            content = `<img class="viewer__img" src="${esc(r.dataUri || '')}" alt="${esc(r.name || '')}">`
          } else if (r.kind === 'pdf') {
            content = `<iframe id="viewerFrame" title="PDF 预览" src="${esc(raw)}"></iframe>`
          } else {
            content = `<div class="viewer__note">这种类型（.${esc(r.ext || '?')}）暂不支持在线预览，请下载原文件查看。</div>`
          }
          $('#viewerBody').innerHTML = download + content
        } catch (e) {
          if (token !== S.__viewerToken) return
          $('#viewerTitle').textContent = '交付文件'
          $('#viewerBody').innerHTML = download + `<div class="viewer__note">打不开：${esc(e.message)}</div>`
        }
      }

      function bindFolds() {
        for (const head of document.querySelectorAll('.fold__head')) {
          head.onclick = () => {
            const fold = head.closest('.fold')
            if (!fold) return
            const expanded = fold.classList.toggle('is-open')
            head.setAttribute('aria-expanded', String(expanded))
            threadFoldState().set(fold.dataset.foldKey, expanded)
          }
        }
      }
      /**
       * 交互卡。状态机对齐 Deva：chat.ts 的 interaction_resolved + remote/types.ts 的 PromptView。
       *   open ──本端作答──▶ answered / cancelled / approve|keep|ignore / mounted|skipped
       *   open ──别处先答──▶ interaction_resolved 到达，同样收成已决态
       * 铁律：同一张卡先到者生效；已决之后本地再点必须失败，不能留下「点了没反应」的卡。
       * 已决态保留答案，供回看。
       */
      function askAnswersHtml(v) {
        // 历史块里 answers 为 null = 已取消（渲染层把 null 归一成空数组时也要能分辨）
        if (!Array.isArray(v.answers)) return ''
        return (v.questions || [])
          .map((q, i) => {
            const a = v.answers[i]
            const empty = !a || !String(a).trim()
            return `<div class="qa">
              <div class="qa__q">${esc(q.question)}</div>
              <div class="qa__a${empty ? ' qa__a--empty' : ''}">${esc(empty ? '（跳过）' : a)}</div>
            </div>`
          })
          .join('')
      }

      /** 历史卡片没有 state 字段，按 answers / decision 反推（对齐渲染层 DisplayBlock）。 */
      function cardState(c) {
        if (c.state) return c.state
        if (c.kind === 'ask') {
          if (Array.isArray(c.answers)) return 'answered'
          return 'cancelled'
        }
        if (c.kind === 'plan') return c.decision || 'cancelled'
        if (c.kind === 'mount') return c.root || c.path ? 'mounted' : 'skipped'
        return 'open'
      }

      function cardHtml(c) {
        const state = cardState(c)
        const open = state === 'open'

        if (c.kind === 'ask') {
          if (!open) {
            const label = state === 'answered' ? '已回答' : '已取消'
            return `<div class="card card--done"><div class="card__head">需要你的回答<span class="badge">${label}</span></div>
              <div class="card__body">${askAnswersHtml(c)}</div></div>`
          }
          const qs = (c.questions || [])
            .map((q, qi) => {
              const opts = (q.options || [])
                .map(
                  (o) => `<label class="opt"><input type="${q.multi ? 'checkbox' : 'radio'}" name="q${qi}" value="${esc(
                    o.label
                  )}">
                    <span><span class="opt__label">${esc(o.label)}</span>${
                      o.description ? `<div class="opt__desc">${esc(o.description)}</div>` : ''
                    }</span></label>`
                )
                .join('')
              const skippable = q.required === false
              return `<div class="q" data-qi="${qi}" data-required="${skippable ? '0' : '1'}">
                <div class="q__title">${esc(q.question)}</div>
                ${skippable ? '<div class="q__hint">可跳过：留空即回灌「未作答」，由助手按默认继续</div>' : ''}
                ${opts}
                <div class="field" style="margin-top:6px">
                  <input type="text" data-free="${qi}" placeholder="或自己输入…" />
                </div>
              </div>`
            })
            .join('')
          return `<div class="card" data-card="ask" data-key="${esc(c.key)}">
            <div class="card__head">需要你的回答<span class="badge">${(c.questions || []).length} 题</span></div>
            <div class="card__body">${qs}</div>
            <div class="card__foot">
              <button data-act="cancel">取消</button>
              <button class="primary-btn" data-act="answer">提交</button>
            </div>
          </div>`
        }

        if (c.kind === 'plan') {
          if (!open) {
            const label =
              state === 'approve'
                ? '已批准'
                : state === 'keep'
                  ? '继续完善'
                  : state === 'ignore'
                    ? '已忽略'
                    : '已取消'
            return `<div class="card card--done"><div class="card__head">待批准的计划<span class="badge">${label}</span></div>
              <div class="card__body"><pre class="planview">${esc(c.plan)}</pre>${
                c.feedback ? `<div class="notice">回复：${esc(c.feedback)}</div>` : ''
              }</div></div>`
          }
          return `<div class="card" data-card="plan" data-key="${esc(c.key)}">
            <div class="card__head">待批准的计划</div>
            <div class="card__body">
              <pre class="planview">${esc(c.plan)}</pre>
              <textarea data-fb placeholder="要调整的话写在这里（可留空）"></textarea>
            </div>
            <div class="card__foot">
              <button data-act="ignore">忽略</button>
              <button data-act="keep">继续完善</button>
              <button class="primary-btn" data-act="approve">批准并执行</button>
            </div>
          </div>`
        }

        if (c.kind === 'mount') {
          if (!open) {
            const label = state === 'mounted' ? '已挂载' : state === 'skipped' ? '暂不挂载' : '已取消'
            return `<div class="card card--done"><div class="card__head">需要挂载工作区<span class="badge">${label}</span></div>
              <div class="card__body">${
                c.root ? `<div class="notice">已挂载工作区：${esc(c.root)}</div>` : ''
              }</div></div>`
          }
          return `<div class="card" data-card="mount" data-key="${esc(c.key)}">
            <div class="card__head">需要挂载工作区</div>
            <div class="card__body">
              <div class="q__title">${
                c.path
                  ? '当前对话未挂载工作区，无法确定相对路径的落点：'
                  : '当前对话未挂载工作区，扫描类操作没有默认的项目根可用。'
              }</div>
              ${c.path ? `<div class="pathbar">${esc(c.path)}</div>` : ''}
              ${c.tool ? `<div class="q__hint">触发于工具 ${esc(c.tool)}</div>` : ''}
            </div>
            <div class="card__foot">
              <button data-act="skip">暂不挂载</button>
              <button class="primary-btn" data-act="pick">选择目录</button>
            </div>
          </div>`
        }

        return ''
      }

      function bindCards() {
        for (const card of document.querySelectorAll('.card[data-card]')) {
          const key = card.dataset.key
          const kind = card.dataset.card

          // 选项高亮（单选整组、复选单个）
          for (const opt of card.querySelectorAll('.opt')) {
            const input = opt.querySelector('input')
            opt.classList.toggle('is-on', input.checked)
            input.onchange = () => {
              if (input.type === 'radio') {
                card
                  .querySelectorAll(`input[name="${input.name}"]`)
                  .forEach((i) => i.closest('.opt').classList.toggle('is-on', i.checked))
              } else {
                opt.classList.toggle('is-on', input.checked)
              }
            }
          }

          for (const btn of card.querySelectorAll('[data-act]')) {
            btn.onclick = async () => {
              const act = btn.dataset.act
              const all = () => [...card.querySelectorAll('[data-act]')]
              all().forEach((b) => (b.disabled = true))
              try {
                if (kind === 'ask') {
                  if (act === 'cancel') {
                    await api('/api/answer', { key, answers: null })
                    resolveCard(key, { state: 'cancelled' })
                  } else {
                    const answers = []
                    let missing = -1
                    card.querySelectorAll('.q').forEach((q) => {
                      const qi = q.dataset.qi
                      const picked = [...q.querySelectorAll('input[type=radio],input[type=checkbox]')]
                        .filter((i) => i.checked)
                        .map((i) => i.value)
                      const free = q.querySelector(`[data-free="${qi}"]`)
                      if (free && free.value.trim()) picked.push(free.value.trim())
                      const answer = picked.join('、')
                      // 必答题不能空（服务端也会拒，这里先拦住，省一次往返）
                      if (!answer && q.dataset.required === '1' && missing < 0) missing = Number(qi) + 1
                      answers.push(answer)
                    })
                    if (missing > 0) {
                      toast('第 ' + missing + ' 题还没有回答')
                      all().forEach((b) => (b.disabled = false))
                      return
                    }
                    await api('/api/answer', { key, answers })
                    resolveCard(key, { state: 'answered', answers })
                  }
                } else if (kind === 'plan') {
                  const fb = card.querySelector('[data-fb]')?.value || ''
                  await api('/api/plan', { key, decision: act, feedback: fb })
                  resolveCard(key, {
                    state: act,
                    feedback: act === 'keep' && fb.trim() ? fb.trim() : undefined
                  })
                } else if (kind === 'mount') {
                  if (act === 'skip') {
                    await api('/api/mount-response', { key, path: null })
                    resolveCard(key, { state: 'skipped' })
                  } else {
                    pickDir('mount', key)
                    all().forEach((b) => (b.disabled = false))
                    return
                  }
                }
                renderThread()
              } catch (e) {
                // 先到者生效：别处已经答过时服务端会回来 false/报错，此时把卡收成已决态
                toast(e.message)
                if (/已经结束|已结束|false/.test(e.message)) resolveCard(key, { state: 'cancelled' })
                else all().forEach((b) => (b.disabled = false))
                renderThread()
              }
            }
          }
        }
      }

      /** 把某张卡本地收成已决态（与服务端广播的 interaction_resolved 同一效果）。 */
      function resolveCard(key, patch) {
        let hit = false
        const apply = (c) => {
          if (!c) return
          // 实时卡片用 key，历史卡片用 id
          if (c.key === key || c.id === key) {
            Object.assign(c, patch)
            hit = true
          }
        }
        if (S.live) {
          for (const c of S.live.cards) apply(c)
        }
        for (const m of S.messages) for (const b of m.blocks || []) apply(b)

        // 已决议的卡要跟着这一轮落进历史，否则回合结束后它就消失了、回看不到当时问了什么。
        // 只对实时卡这么做：它的 key 只存在于本轮的 L.cards 里。
        if (S.live) {
          const idx = S.live.cards.findIndex((c) => c.key === key)
          if (idx >= 0) {
            const c = S.live.cards[idx]
            if (patch.state && patch.state !== 'open') {
              S.live.historyCards = S.live.historyCards || []
              S.live.historyCards.push({
                kind: c.kind,
                id: c.key,
                questions: c.questions,
                answers: patch.state === 'answered' ? patch.answers : null,
                plan: c.plan,
                decision: c.kind === 'plan' ? patch.state : undefined,
                feedback: patch.feedback,
                tool: c.tool,
                path: c.path,
                state: patch.state,
                root: patch.root
              })
            }
          }
          S.live.cards = S.live.cards.filter((c) => c.key !== key)
          S.live.status = ''
        }
        return hit
      }

      // ───────── 事件 ─────────
      /**
       * 回合键单调递增，永不复用。
       *
       * 折叠展开状态按 key 记忆：如果序号在某个地方被重置，新一轮就会撞上上一轮的 key，
       * 于是「上一轮我手动展开了」被继承下来——看起来像新消息自动展开。
       */
      let turnSerial = 0
      function nextTurnKey() {
        return `turn:auto:${++turnSerial}`
      }

      function ensureLive() {
        const L = S.live || (S.live = {})
        for (const key of ['text', 'thinking', 'status', 'error']) L[key] ??= ''
        for (const key of ['cards', 'historyCards', 'stepList']) L[key] ||= []
        L.tools ||= new Set()
        if (!L.blocks) {
          L.blocks = []
          if (L.thinking) L.blocks.push({ kind: 'thinking', text: L.thinking })
          if (L.text) L.blocks.push({ kind: 'text', text: L.text })
          L.blocks.push(...L.cards, ...L.historyCards)
          if (L.error) L.blocks.push({ kind: 'error', text: L.error })
        }
        L.foldKey ||= (S.__pendingTurn || S.turnId) ? `turn:${S.__pendingTurn || S.turnId}` : nextTurnKey()
        return L
      }

      function toolLabel(name, args) {
        const a = args && typeof args === 'object' ? args : {}
        const p = a.path || a.pattern || a.command || a.query || a.url || a.description || ''
        return { name, arg: String(p).replace(/\s+/g, ' ').slice(0, 90) }
      }

      function applyEvent(e, silent) {
        const L = ensureLive()
        switch (e.type) {
          case 'turn_start': {
            const turnId = S.__pendingTurn || S.turnId
            if (turnId) S.turnId = turnId
            S.inserts = []
            L.text = ''
            L.thinking = ''
            L.cards = []
            L.historyCards = []
            L.blocks = []
            L.stepList = []
            L.tools = new Set()
            L.foldKey = turnId ? `turn:${turnId}` : nextTurnKey()
            // 计时锚点：优先用主进程记的起轮时间（中途接入也准），没有才用本地此刻
            const sess = S.sessions.find(s => s.id === S.sessionId)
            L.startedAt = Number(e.startedAt || sess?.startedAt || 0) || Date.now()
            L.error = ''
            L.status = ''
            // 用户气泡只加一次：中途接入时 inflight 里会重放 turn_start，
            // 而那轮的用户消息多半已经在历史末尾了（Deva 在回合开始时就落了盘）。
            const last = S.messages[S.messages.length - 1]
            const userText = e.user?.text || ''
            const attachments = e.user?.attachments || []
            const attachmentKey = items => JSON.stringify((items || []).map(a => typeof a === 'string' ? a : [a.name || '', a.kind || '']))
            const already = last && last.role === 'user' && (last.text || '') === userText
              && attachmentKey(last.attachments) === attachmentKey(attachments)
            if ((userText || attachments.length) && !already) {
              S.messages.push({ role: 'user', text: userText, attachments, notify: e.user.notify })
            }
            break
          }
          case 'text_delta':
          case 'thinking_delta': {
            const kind = e.type === 'text_delta' ? 'text' : 'thinking'
            const last = L.blocks[L.blocks.length - 1]
            if (last?.kind === kind) last.text += e.text || ''
            else L.blocks.push({ kind, text: e.text || '' })
            // 兼容调用方读取旧字段；渲染和落历史只使用有序 blocks。
            L[kind === 'text' ? 'text' : 'thinking'] += e.text || ''
            L.status = ''
            break
          }
          case 'tool_call': {
            const t = toolLabel(e.name, e.args)
            const findParent = blocks => {
              for (const b of blocks) {
                if (b.id === e.parent && (b.kind === 'tool' || b.kind === 'subagent')) return b
                const nested = b.blocks && findParent(b.blocks)
                if (nested) return nested
              }
              return null
            }
            const parent = e.parent && findParent(L.blocks)
            const target = parent ? (parent.blocks ||= []) : L.blocks
            if (!target.some(b => b.id === e.id && b.kind === 'tool')) target.push({ kind: 'tool', id: e.id, name: e.name, args: e.args, status: 'running', depth: e.depth, parent: e.parent })
            L.tools.add(e.id)
            L.status = t.arg ? `${t.name} · ${t.arg}` : t.name
            break
          }
          case 'tool_result': {
            const update = blocks => {
              for (const b of blocks) {
                if (b.id === e.id && (b.kind === 'tool' || b.kind === 'subagent')) {
                  Object.assign(b, { status: e.isError ? 'error' : 'ok', summary: e.summary || '' })
                  return true
                }
                if (b.blocks && update(b.blocks)) return true
              }
              return false
            }
            if (!update(L.blocks)) L.blocks.push({ kind: 'tool', id: e.id, name: e.name, status: e.isError ? 'error' : 'ok', summary: e.summary || '' })
            L.tools.delete(e.id)
            L.status = ''
            break
          }
          case 'stream_reset':
            while (['text', 'thinking'].includes(L.blocks.at(-1)?.kind)) L.blocks.pop()
            L.text = L.blocks.filter(b => b.kind === 'text').map(b => b.text).join('')
            L.thinking = L.blocks.filter(b => b.kind === 'thinking').map(b => b.text).join('')
            break
          case 'todo_done':
            L.blocks.push({ kind: 'todolist', id: e.id, title: e.title, items: e.items || [] })
            break
          case 'compacted':
            L.blocks.push({ kind: e.status === 'compacted' ? 'compaction' : 'notice', text: e.message || '上下文压缩已处理' })
            break
          case 'notice':
          case 'insert':
            L.blocks.push({ ...e, kind: e.type })
            break
          case 'inserts': {
            // 主进程回的「当前这一轮还有哪几条插入没送到」：拿它更新输入区的提示条，
            // 用户能确认自己那句话真的插进去了，而不是发到了空气里。
            S.inserts = Array.isArray(e.pending) ? e.pending.slice() : []
            renderComposer()
            return
          }
          case 'inserts_returned': {
            // 插入被撤回（例如这一轮被停掉）：把原文还给输入框，别让它凭空消失
            S.inserts = []
            renderComposer()
            const back = typeof e.text === 'string' ? e.text.trim() : ''
            const input = $('#input')
            if (back && input) {
              input.value = input.value.trim() ? `${back}\n\n${input.value}` : back
              autoGrow()
            }
            if (back) toast('这一轮已结束，插入的内容还回了输入框')
            return
          }
          case 'ask_user':
            L.status = '等待你的回答'
            L.cards.push({ kind: 'ask', key: e.key, questions: e.questions || [], state: 'open' })
            L.blocks.push(L.cards[L.cards.length - 1])
            break
          case 'plan_review':
            L.status = '等待你批准计划'
            L.cards.push({ kind: 'plan', key: e.key, plan: e.plan || '', state: 'open' })
            L.blocks.push(L.cards[L.cards.length - 1])
            break
          case 'mount_request':
            L.status = '等待选择工作目录'
            L.cards.push({ kind: 'mount', key: e.key, tool: e.tool, path: e.path, state: 'open' })
            L.blocks.push(L.cards[L.cards.length - 1])
            break
          case 'interaction_resolved': {
            // 同一张卡可能同时显示在桌面和其他端：先到者生效，这里把卡收成已决态
            const patch =
              e.kind === 'ask'
                ? { state: e.answers ? 'answered' : 'cancelled', answers: e.answers ?? undefined }
                : e.kind === 'plan'
                  ? { state: e.decision || 'cancelled', feedback: e.feedback }
                  : { state: e.path ? 'mounted' : 'skipped', root: e.path ?? undefined }
            resolveCard(e.key, patch)
            L.cards = L.cards.filter((c) => c.key !== e.key)
            L.status = ''
            break
          }
          case 'error':
            L.error = e.message || '出错了'
            L.blocks.push({ kind: 'error', text: L.error })
            L.status = ''
            break
          case 'reconnecting':
            L.status = `连接中断，重连中 ${e.attempt}/${e.max}`
            break
          case 'auto_retry':
            L.status = `自愈重试 ${e.attempt}/${e.max}：${e.reason}`
            break
          case 'compacting':
            L.status = e.active ? '正在压缩上下文…' : ''
            break
          case 'done': {
            // 已决卡按原位置保留；结束时未决卡收敛，不留下可提交的过期按钮。
            const blocks = liveBlocks(L).filter(b => !(['ask', 'plan', 'mount'].includes(b.kind) && b.state === 'open'))
            for (const b of blocks) if (b.status === 'running') b.status = 'cancelled'
            S.messages.push({ role: 'assistant', blocks, durationMs: e.durationMs, foldKey: L.foldKey })
            S.live = null
            S.turnId = null
            S.__pendingTurn = null
            S.inserts = []
            break
          }
          default:
            return
        }
        if (!silent) {
          // 流式增量只更新「正在写的那一条」，不重建整条时间线。
          // 之前每个 text_delta 都 renderThread()，历史消息全部重新解析 Markdown + 重排，
          // 一段长回复会触发几百次全量重绘——输入一多整个页面就卡住。
          if (e.type === 'text_delta' || e.type === 'thinking_delta') {
            patchLiveText()
          } else {
            renderThread()
          }
        }
        scrollBottom()
      }

      /** 只把流式中最后一段正文/思考的文字替换掉，其余 DOM 不动。 */
      function patchLiveText() {
        const L = S.live
        if (!L) return
        const node = document.querySelector('#threadInner [data-live-text] .md')
        const blocks = liveBlocks(L)
        let text = ''
        for (let i = blocks.length - 1; i >= 0; i--) {
          if (blocks[i].kind === 'text') { text = blocks[i].text; break }
        }
        if (!node) { renderThread(); return }
        node.innerHTML = renderMd(text)
      }

      let resyncing = false
      let currentRequest = 0
      async function syncCurrentSession() {
        const sid = S.sessionId
        if (!sid || resyncing || document.hidden) return
        resyncing = true
        const version = ++currentRequest
        const observed = lastStreamAt
        try {
          const r = await api('/api/session?id=' + encodeURIComponent(sid))
          if (sid !== S.sessionId || version !== currentRequest || observed !== lastStreamAt) return
          const previous = S.messages
          S.messages = (r.messages || []).map((m, i) => {
            const old = previous[i]
            return m.role === 'assistant' && old?.role === 'assistant' && old.foldKey
              ? { ...m, foldKey:old.foldKey } : m
          })
          S.deliverables = r.deliverables || []
          // 服务端快照可能比刚落地的 turn_start 更旧（打开会话/轮询与 SSE 竞争）。
          // 本地已在跑而快照说空闲时，保留本地这一轮，别把运行中的按钮和计时抹掉。
          // 但要认得出「这轮真的结束了」：快照带 completedAt 且晚于本地起轮时间 → 接受快照。
          // 否则（快照纯粹是旧数据）10 分钟内保留本地状态。
          const startedAt = S.live?.startedAt || 0
          const localRunning = S.turnId && S.turnId !== 'pending'
          const finishedPerSnapshot = r.completedAt && (!startedAt || r.completedAt >= startedAt)
          if (localRunning && !r.turnId && !finishedPerSnapshot && startedAt && Date.now() - startedAt < 10 * 60 * 1000) return
          S.turnId = r.turnId || null
          S.__pendingTurn = S.turnId
          S.live = null
          if (!S.turnId) S.inserts = []
          else S.inserts = Array.isArray(r.pendingInserts) ? r.pendingInserts.slice() : S.inserts
          if (S.turnId) {
            ensureLive()
            for (const e of r.inflight || []) applyEvent(e, true)
          }
          if (!S.turnId && S.view === 'chat') markRead(sid, r.completedAt)
          renderThread()
          renderSessions()
        } catch (e) { console.warn('同步会话失败', e.message) }
        finally { resyncing = false }
      }
      function updateSessionState(sid, patch) {
        sessionRevisions.set(sid, (sessionRevisions.get(sid) || 0) + 1)
        const s = S.sessions.find(x => x.id === sid)
        if (!s) { loadSessions(); return }
        Object.assign(s, patch)
        if (!s.running && sid === S.sessionId && S.view === 'chat' && !document.hidden)
          markRead(sid, s.completedAt)
        renderSessions()
      }
      function connectEvents() {
        const es = new EventSource('/api/events')
        es.onopen = () => { loadSessions(); syncCurrentSession() }
        es.onerror = () => $('#dot').classList.remove('on')
        es.onmessage = m => {
          let v
          try { v = JSON.parse(m.data) } catch { return }
          if (v.k === 'state') {
            $('#dot').classList.toggle('on', v.deva === 'running' && v.page)
            return
          }
          if (v.k === 'sessions') {
            if (v.snapshot && v.sessionStates) {
              for (const [sid, patch] of Object.entries(v.sessionStates)) updateSessionState(sid, patch)
              syncCurrentSession()
            } else if (v.sid && typeof v.running === 'boolean') {
              updateSessionState(v.sid, {
                running:v.running, turnId:v.turnId || null,
                completedAt:v.completedAt || null, startedAt:v.startedAt || null
              })
              if (!v.running && v.sid === S.sessionId) setTimeout(syncCurrentSession, 200)
            }
            loadSessions()
            return
          }
          if (v.k !== 'ev' || !v.e) return
          lastStreamAt = Date.now()
          if (v.e.type === 'turn_start')
            updateSessionState(v.sid, { running:true, turnId:v.turnId })
          else if (v.e.type === 'done') {
            const session = S.sessions.find(s => s.id === v.sid)
            if (!session?.turnId || session.turnId === v.turnId)
              updateSessionState(v.sid, { running:false, turnId:null, completedAt:Date.now() })
          }
          if (v.sid !== S.sessionId) return
          if (v.e.type === 'turn_start' && v.turnId) {
            S.__pendingTurn = v.turnId
            S.turnId = v.turnId
          } else if (S.turnId && S.turnId !== 'pending' && v.turnId && v.turnId !== S.turnId) return
          applyEvent(v.e)
          if (v.e.type === 'done') setTimeout(syncCurrentSession, 200)
        }
        // 手机锁屏期间 SSE 可能断开；回到前台主动校准，正常情况下每五秒仅校准列表。
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) { loadSessions(); syncCurrentSession() }
        })
        window.addEventListener('pageshow', () => { loadSessions(); syncCurrentSession() })
        setInterval(() => {
          if (document.hidden) return
          loadSessions()
          if (S.turnId && Date.now() - lastStreamAt > 6000) syncCurrentSession()
        }, 5000)
      }

      // ───────── 发送 / 插入 / 停止 ─────────
      // 三件互不兼职的事，各有独立入口：
      //   sendCurrent()   空闲时把输入发成新一轮
      //   insertCurrent() 运行中把输入插到当前轮（chat:insert，不新开一轮）
      //   stopCurrent()   停止当前会话正在跑的那一轮（只用真实 turnId）
      // 发送键在运行中变成「插入」，停止键是单独的一颗，两者不再共用同一个按钮。

      /** 可用作插入/停止的真实 turnId：'pending' 只是本地占位，不算。 */
      function liveTurnId() {
        return S.turnId && S.turnId !== 'pending' ? S.turnId : null
      }

      /** 停止当前会话的当前轮：只认 S.turnId，绝不猜、也不波及别的会话。 */
      async function stopCurrent() {
        if (S.__stopping) return
        const sid = S.sessionId
        const turnId = liveTurnId()
        if (!sid) return
        if (!turnId) {
          toast(S.turnId ? '这一轮还在启动，稍等一秒再停止' : '当前没有在运行的回合')
          return
        }
        S.__stopping = true
        renderComposer()
        try {
          const r = await api('/api/abort', { sessionId: sid, turnId })
          if (S.sessionId === sid) {
            if (r && r.alreadyEnded) {
              toast('这一轮已经结束了')
              void syncCurrentSession()
            } else if (r && r.stale) {
              toast('页面状态落后了，已停止当前这一轮')
            } else {
              toast('已请求停止')
            }
          }
          // 真正的 done 由 Deva 推上来，这里不伪造本地结束；
          // 只做一次兜底校准：万一 done 事件丢了，按钮不该永远停在「运行中」。
          setTimeout(() => {
            if (S.sessionId === sid && liveTurnId()) syncCurrentSession()
          }, 1500)
        } catch (e) {
          toast('停止失败：' + e.message)
        } finally {
          S.__stopping = false
          renderComposer()
        }
      }

      /** 运行中把输入插到当前轮。附件不支持：明确提示并保留草稿。 */
      async function insertCurrent() {
        const input = $('#input')
        const text = input.value.trim()
        const sid = S.sessionId
        if (!sid) return
        if (!text) {
          toast('插入需要一段文字')
          input.focus()
          return
        }
        if (S.pending.length) {
          toast('插入不支持附件：请先移除附件，或等这一轮结束后再发送')
          return
        }
        if (!liveTurnId()) {
          toast('这一轮还在启动，稍等一秒再插入')
          return
        }
        if (S.__inserting) return
        S.__inserting = true
        try {
          const r = await api('/api/insert', { sessionId: sid, turnId: liveTurnId(), text })
          if (r && r.ok === false) throw new Error(r.error || '插入被拒绝')
          if (S.sessionId === sid) {
            // 成功才清草稿；失败一次都不动输入框，用户不必重打
            input.value = ''
            autoGrow()
            // 清空后同一枚键要从「发送」变回「停止」，必须立刻重渲染
            renderComposer()
            toast(r && r.stale ? '已排队（页面状态略旧，模型下一步会读到）' : '已排队，模型进行中会自动读到')
          }
        } catch (e) {
          toast('插入失败：' + e.message)
          if (S.sessionId === sid) input.focus()
        } finally {
          S.__inserting = false
        }
      }

      /** 发送键：运行中走插入，空闲才发新一轮。 */
      /**
       * 同一枚键的分发（对齐桌面端 canInsert = streaming && 有文字）：
       *   空闲           → 发新消息
       *   运行中 + 有文字 → 插入当前轮（排队）
       *   运行中 + 空     → 停止当前轮
       */
      async function sendOrInsert() {
        if (!S.turnId) return sendCurrent()
        if ($('#input').value.trim()) return insertCurrent()
        return stopCurrent()
      }

      async function sendCurrent() {
        const input = $('#input')
        const text = input.value.trim()
        if ((!text && !S.pending.length) || !S.sessionId) return
        if (S.turnId) return
        input.value = ''
        autoGrow()

        // 有附件就先落盘换成绝对路径，再随消息一起发（Deva 的 attachments 要的是路径）
        let attachments
        const pending = S.pending.slice()
        if (pending.length) {
          S.pending = []
          renderPending()
          try {
            // 交给网关，由网关在 Deva 渲染层里调 pasteAttachment：主进程落盘并授权。
            // 浏览器里没有 window.deva，不能在这里直接调渲染层接口（会 undefined 报错）。
            const up = await api('/api/asset-stage', {
              files: pending.map((p) => ({ name: p.name, mime: p.mime || '', data: p.data }))
            })
            attachments = up.paths
          } catch (e) {
            S.pending = pending
            renderPending()
            // 草稿文本原样留在输入框里，不让用户重打
            if (!input.value) {
              input.value = text
              autoGrow()
            }
            toast('附件没加上：' + e.message)
            return
          }
        }

        S.turnId = 'pending'
        S.stickBottom = true
        renderThread()
        try {
          const r = await api('/api/send', { sessionId: S.sessionId, text, attachments })
          if (r.turnId && S.turnId === 'pending') S.turnId = r.turnId
          renderThread()
        } catch (e) {
          S.turnId = null
          if (!input.value) {
            input.value = text
            autoGrow()
          }
          ensureLive().error = e.message
          renderThread()
        }
      }

      function autoGrow() {
        const el = $('#input')
        el.style.height = 'auto'
        el.style.height = Math.min(el.scrollHeight, 160) + 'px'
      }

      function scrollBottom(force) {
        const el = $('#thread')
        const near = el.scrollHeight - el.scrollTop - el.clientHeight < 120
        if (force || S.stickBottom || near) {
          el.scrollTop = el.scrollHeight
          S.stickBottom = true
        }
        $('#jumpBtn').classList.toggle('is-open', !S.stickBottom)
      }

      // ───────── 模型 / 新建 / 目录 ─────────
      async function ensureMeta() {
        if (!S.models.providers.length) S.models = await api('/api/models')
        if (!S.personas.length) S.personas = await api('/api/personas')
      }

      function modelOptions(selected) {
        return S.models.providers
          .map(
            (p) =>
              `<optgroup label="${esc(p.name)}">` +
              p.models
                .map((m) => {
                  const ref = `${p.id}:${m.id}`
                  return `<option value="${esc(ref)}"${ref === selected ? ' selected' : ''}>${esc(m.name || m.id)}</option>`
                })
                .join('') +
              '</optgroup>'
          )
          .join('')
      }

      /**
       * 模型 / 思考强度选择菜单（照桌面端图二）：
       * 就在被点的那个 chip 正上方弹出，按供应商分组，当前项打勾，点一下立即生效。
       * 取代原来那个底部大弹层——那里下面一大片空白，还得再点下拉、再点「应用」。
       */
      let pickerOpen = false

      function closePicker() {
        const el = $('#picker')
        if (el) el.remove()
        pickerOpen = false
        document.removeEventListener('click', onPickerOutside, true)
      }

      function onPickerOutside(e) {
        const el = $('#picker')
        if (!el) return
        if (el.contains(e.target) || e.target.closest('#modelChip,#effortChip')) return
        closePicker()
      }

      async function openPicker(kind) {
        try {
          await ensureMeta()
        } catch (e) {
          return toast(e.message)
        }
        closePicker()
        const anchor = kind === 'effort' ? $('#effortChip') : $('#modelChip')
        if (!anchor) return

        const curRef = S.meta?.model || S.models.activeModelId || ''
        const curEffort = effectiveEffort()

        let body = ''
        if (kind === 'effort') {
          body = `<div class="picker__group"><div class="picker__head">思考强度</div>${EFFORTS.map(
            ([v, l]) =>
              `<button class="picker__item${v === curEffort ? ' is-active' : ''}" data-effort="${esc(v)}" type="button">
                 <span class="picker__label">${esc(l)}</span>
                 ${v === curEffort ? '<svg class="picker__check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>' : ''}
               </button>`
          ).join('')}</div>`
        } else {
          // 当前模型属于哪个供应商：它的分组圆点用主题色（桌面端也是这样区分）
          const curPid = curRef.includes(':') ? curRef.slice(0, curRef.indexOf(':')) : ''
          body = S.models.providers
            .map(
              (p) =>
                `<div class="picker__group">
                   <div class="picker__head"><span class="picker__dot${p.id === curPid ? ' is-current' : ''}"></span>${esc(p.name)}</div>
                   ${p.models
                     .map((m) => {
                       const ref = `${p.id}:${m.id}`
                       const active = ref === curRef
                       return `<button class="picker__item${active ? ' is-active' : ''}" data-ref="${esc(ref)}" type="button">
                         <span class="picker__label">${esc(m.name || m.id)}</span>
                         ${active ? '<svg class="picker__check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>' : ''}
                       </button>`
                     })
                     .join('')}
                 </div>`
            )
            .join('')
        }

        const el = document.createElement('div')
        el.id = 'picker'
        el.className = 'picker'
        el.innerHTML = `<div class="picker__box">${body}</div>`
        document.body.appendChild(el)
        pickerOpen = true

        // 贴着 chip 正上方；上面放不下就翻到下面
        const r = anchor.getBoundingClientRect()
        const box = el.firstElementChild
        const bw = box.offsetWidth
        const bh = box.offsetHeight
        let left = kind === 'effort' ? r.right - bw : r.left
        left = Math.max(8, Math.min(left, window.innerWidth - bw - 8))
        let top = r.top - bh - 6
        if (top < 8) top = r.bottom + 6
        el.style.left = left + 'px'
        el.style.top = top + 'px'

        el.onclick = (e) => {
          const item = e.target.closest('.picker__item')
          if (!item) return
          if (item.dataset.effort) return pickEffort(item.dataset.effort)
          if (item.dataset.ref) return pickModel(item.dataset.ref)
        }
        // 延后挂外部点击，避免这次的点击立刻把自己关掉
        setTimeout(() => document.addEventListener('click', onPickerOutside, true), 0)
      }

      /** 选模型：点一下立即生效（桌面端行为），不再需要「应用」。 */
      async function pickModel(modelRef) {
        closePicker()
        if (!S.sessionId) return
        if (modelRef === (S.meta?.model || S.models.activeModelId)) return
        try {
          await api('/api/set-model', { sessionId: S.sessionId, modelRef })
          if (S.meta) S.meta.model = modelRef
          updateHeader()
          updateChips()
          toast('已切换模型')
        } catch (e) {
          toast(e.message)
        }
      }

      async function pickEffort(effort) {
        closePicker()
        if (!S.sessionId) return
        if (effort === effectiveEffort()) return
        try {
          await api('/api/set-effort', { sessionId: S.sessionId, effort })
          // 记在本会话上，并同步进列表项——loadSessions 会整体替换 S.sessions，
          // 不写回列表的话下一次轮询就会把这个值冲掉（表现为刷新又变回默认）。
          effortMemo[S.sessionId] = effort
          const row = S.sessions.find((s) => s.id === S.sessionId)
          if (row) row.effort = effort
          if (S.meta) S.meta.effort = effort
          updateChips()
          toast('思考强度：' + effortLabel(effort))
        } catch (e) {
          toast(e.message)
        }
      }


      async function openNewSheet() {
        try {
          await ensureMeta()
          // 默认选中兜底身份：Deva 里的规则是「优先 general，其次花名册首个」（见 ChatFirstShell
          // 的 defaultPersona），新会话本就该有身份，不该逼用户每次自己挑。
          const fallback = S.personas.find((p) => p.id === 'general') || S.personas[0]
          $('#newPersona').innerHTML = S.personas
            .map(
              (p) =>
                `<option value="${esc(p.id)}"${p.id === fallback?.id ? ' selected' : ''}>${esc(p.name)}</option>`
            )
            .join('')
          $('#newModel').innerHTML = modelOptions(S.models.activeModelId)
          $('#newFocus').value = ''
          openSheet('#newSheet')
        } catch (e) {
          toast(e.message)
        }
      }

      async function createSession() {
        try {
          const r = await api('/api/new-session', {
            personaId: $('#newPersona').value || undefined,
            modelRef: $('#newModel').value || undefined,
            focusRoot: $('#newFocus').value.trim() || null
          })
          closeSheets()
          await loadSessions()
          await openSession(r.sessionId)
        } catch (e) {
          toast(e.message)
        }
      }

      // ───────── 图片全屏查看 ─────────
      // 站内层：不跳新标签页，返回后不会卡在浏览器图片页。
      function openLightbox(src) {
        $('#lightboxImg').setAttribute('src', src)
        $('#lightbox').classList.add('is-open')
        window.history.pushState({ lightbox: true }, '')
      }
      function closeLightbox() {
        $('#lightbox').classList.remove('is-open')
        $('#lightboxImg').removeAttribute('src')
      }
      /** 关图片触发的 history.back() 会在 popstate 里被误当成「退出对话」，用这个标记区分。 */
      let closingLightbox = false
      document.addEventListener('click', (e) => {
        const thumb = e.target.closest('.attach__img[data-img]')
        if (!thumb) return
        e.preventDefault()
        openLightbox(thumb.dataset.img)
      })
      $('#lightboxClose').onclick = () => {
        closeLightbox()
        if (window.history.state?.lightbox) {
          // 标记住：紧接着到来的 popstate 只用来消耗这条历史，不能再退一步
          closingLightbox = true
          window.history.back()
          setTimeout(() => { closingLightbox = false }, 400)
        }
      }
      $('#lightbox').onclick = (e) => {
        if (e.target === $('#lightbox')) $('#lightboxClose').click()
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('#lightbox').classList.contains('is-open')) $('#lightboxClose').click()
      })
      // 手机右滑关闭（和看图应用一致）
      let lbStartX = null
      $('#lightbox').addEventListener('touchstart', (e) => { lbStartX = e.touches[0].clientX }, { passive: true })
      $('#lightbox').addEventListener('touchend', (e) => {
        if (lbStartX === null) return
        const dx = e.changedTouches[0].clientX - lbStartX
        lbStartX = null
        if (dx > 70) $('#lightboxClose').click()
      }, { passive: true })
      window.addEventListener('popstate', () => {
        if ($('#lightbox').classList.contains('is-open')) closeLightbox()
      })

      // ───────── 附件（图片 / 任意文件） ─────────
      // 手机没法像电脑那样粘贴，所以给一个明确入口：加号 → 图片 / 文件。
      // 图片先在前端压一下尺寸（手机原图动辄几 MB）；其它文件原样传。
      // 最终都由网关落盘、把绝对路径交给 Deva——和桌面端选文件是同一条通路，
      // 类型识别（图片 / PDF / 文本）也由 Deva 自己做，这里不猜。
      const MAX_EDGE = 1600
      const MAX_FILE = 32 * 1024 * 1024

      function readAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const fr = new FileReader()
          fr.onload = () => resolve(String(fr.result))
          fr.onerror = () => reject(new Error('读取文件失败'))
          fr.readAsDataURL(file)
        })
      }

      /** 长边超过 MAX_EDGE 时缩一下，省流量也省主进程的解析开销。 */
      async function shrink(dataUrl) {
        const img = await new Promise((resolve, reject) => {
          const i = new Image()
          i.onload = () => resolve(i)
          i.onerror = () => reject(new Error('图片无法解码'))
          i.src = dataUrl
        })
        const long = Math.max(img.width, img.height)
        if (long <= MAX_EDGE) return dataUrl
        const scale = MAX_EDGE / long
        const canvas = document.createElement('canvas')
        canvas.width = Math.round(img.width * scale)
        canvas.height = Math.round(img.height * scale)
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
        return canvas.toDataURL('image/jpeg', 0.86)
      }

      function fmtSize(n) {
        if (!n) return ''
        if (n < 1024) return n + ' B'
        if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB'
        return (n / 1024 / 1024).toFixed(1) + ' MB'
      }

      function renderPending() {
        document.querySelector('#pendingFiles')?.remove()
        $('#pendingImgs').innerHTML = S.pending
          .map((p, i) => {
            const thumb = p.isImage
              ? `<img src="${p.data}" alt="">`
              : `<span class="pimg__doc">${esc((p.name.split('.').pop() || '?').slice(0, 4).toUpperCase())}</span>`
            return `<div class="pimg" title="${esc(p.name)}">${thumb}<button class="pimg__x" data-i="${i}" aria-label="移除">×</button></div>`
          })
          .join('')
        // 非图片的附件在缩略图下面补个文件名，不然只看到一个方块
        const docs = S.pending.filter((p) => !p.isImage)
        if (docs.length) {
          $('#pendingImgs').insertAdjacentHTML(
            'afterend',
            `<div class="pending-files" id="pendingFiles">${docs
              .map((p) => `<span class="attach__item">▤ ${esc(p.name)}<span style="opacity:.6">${fmtSize(p.size)}</span></span>`)
              .join('')}</div>`
          )
        } else {
          document.querySelector('#pendingFiles')?.remove()
        }
        for (const btn of document.querySelectorAll('.pimg__x')) {
          btn.onclick = () => {
            S.pending.splice(Number(btn.dataset.i), 1)
            renderPending()
          }
        }
      }

      async function onFilesPicked(files) {
        const list = [...(files || [])]
        if (!list.length) return
        for (const f of list) {
          try {
            if (f.size > MAX_FILE) {
              toast(`「${f.name}」超过 32MB，没加上`)
              continue
            }
            const isImage = f.type.startsWith('image/')
            let data = await readAsDataUrl(f)
            if (isImage) data = await shrink(data).catch(() => data)
            S.pending.push({ data, name: f.name || '粘贴的图片', size: f.size, isImage, mime: f.type || '' })
          } catch (e) {
            toast(e.message)
          }
        }
        renderPending()
      }

      async function pickDir(purpose, key) {
        S.dir = { path: '', purpose, key: key || null }
        $('#dirTitle').textContent = purpose === 'mount' ? '选择要挂载的目录' : '选择工作目录'
        openSheet('#dirSheet')
        await browseDir('')
      }

      async function browseDir(p) {
        try {
          const r = await api('/api/dirs?path=' + encodeURIComponent(p))
          S.dir.path = r.path || ''
          $('#dirPath').textContent = r.path || '此电脑'
          let h = ''
          if (r.parent !== null) h += `<div class="dirrow" data-p="${esc(r.parent)}"><span class="dirrow__ico">↰</span><span class="dirrow__name">上一级</span></div>`
          h += (r.dirs || [])
            .map(
              (d) =>
                `<div class="dirrow" data-p="${esc(d.path)}"><span class="dirrow__ico">⌂</span><span class="dirrow__name">${esc(
                  d.name
                )}</span></div>`
            )
            .join('')
          $('#dirList').innerHTML = h || '<div class="dirrow"><span class="dirrow__name" style="color:var(--fg-subtle)">空目录</span></div>'
          for (const row of $('#dirList').querySelectorAll('.dirrow[data-p]')) {
            row.onclick = () => browseDir(row.dataset.p)
          }
        } catch (e) {
          toast(e.message)
        }
      }

      async function useDir() {
        const target = S.dir.path || null
        try {
          if (S.dir.purpose === 'mount') {
            await api('/api/mount-response', { key: S.dir.key, path: target })
            if (target && S.meta) S.meta.focusRoot = target
            if (S.live) S.live.cards = S.live.cards.filter((c) => c.key !== S.dir.key)
            renderThread()
            updateHeader()
            updateChips()
          } else if (S.dir.purpose === 'new') {
            $('#newFocus').value = target || ''
          } else {
            await api('/api/set-focus', { sessionId: S.sessionId, focusRoot: target })
            if (S.meta) S.meta.focusRoot = target
            updateHeader()
            updateChips()
          }
          closeSheets()
        } catch (e) {
          toast(e.message)
        }
      }

      /** 挂载 chip：未挂载只露文件夹图标；挂载后展开显示文件夹名，一眼看出挂到哪儿。 */
      function setFocusChip(root) {
        const chip = $('#focusChip')
        const text = $('#focusText')
        if (!chip || !text) return
        const name = root ? String(root).split(/[\\/]/).filter(Boolean).pop() : ''
        chip.classList.toggle('has-text', !!name)
        text.hidden = !name
        text.textContent = name
        chip.title = name ? `已挂载：${root}` : '挂载工作区'
        chip.setAttribute('aria-label', chip.title)
      }

      function updateChips() {
        if (!S.meta) return
        $('#modelText').textContent = modelShort(S.meta.model)
        setFocusChip(S.meta.focusRoot)
        const eff = $('#effortText')
        if (eff) {
          eff.textContent = effortLabel(effectiveEffort())
        }
      }

      // ───────── 弹层 ─────────
      function openSheet(sel) {
        closeSheets()
        $(sel).classList.add('is-open')
      }
      function closeSheets() {
        document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('is-open'))
      }

      // ───────── 绑定 ─────────
      $('#backBtn').onclick = () => {
        if (window.history.state?.deva) window.history.back()
        else backToList()
      }
      window.addEventListener('popstate', () => {
        // 关图片时我们自己触发过一次 history.back()，那次 popstate 只算「收起图片」，
        // 不能再退到列表——否则点完关闭就回不到当前对话了。
        if (closingLightbox) { closingLightbox = false; return }
        if ($('#lightbox').classList.contains('is-open')) { closeLightbox(); return }
        if (S.sessionId && !isWide()) backToList()
      })
      $('#newBtn').onclick = openNewSheet
      $('#sendBtn').onclick = sendOrInsert
      $('#attachChip').onclick = (e) => {
        e.stopPropagation()
        const menu = $('#attachMenu')
        if (menu.classList.contains('is-open')) return closeAttachMenu()
        // 贴着加号弹出，手机上不至于跑到屏幕外
        const r = $('#attachChip').getBoundingClientRect()
        menu.classList.add('is-open')
        const mw = menu.offsetWidth
        const mh = menu.offsetHeight
        let left = r.left
        let top = r.top - mh - 8
        if (top < 8) top = r.bottom + 8
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8))
        menu.style.left = left + 'px'
        menu.style.top = top + 'px'
      }
      function closeAttachMenu() {
        $('#attachMenu').classList.remove('is-open')
      }
      $('#attachMenu').onclick = (e) => {
        const item = e.target.closest('[data-kind]')
        if (!item) return
        closeAttachMenu()
        if (item.dataset.kind === 'image') $('#fileInput').click()
        else $('#fileInputAny').click()
      }
      document.addEventListener('click', closeAttachMenu)

      $('#fileInput').onchange = async (e) => {
        await onFilesPicked(e.target.files)
        e.target.value = ''
      }
      $('#fileInputAny').onchange = async (e) => {
        await onFilesPicked(e.target.files)
        e.target.value = ''
      }
      // 电脑上直接 Ctrl+V 贴图，和桌面端习惯一致
      document.addEventListener('paste', (e) => {
        const items = [...(e.clipboardData?.items || [])].filter((i) => i.type.startsWith('image/'))
        if (!items.length) return
        e.preventDefault()
        onFilesPicked(items.map((i) => i.getAsFile()).filter(Boolean))
      })
      $('#modelChip').onclick = (e) => { e.stopPropagation(); pickerOpen ? closePicker() : openPicker('model') }
      $('#effortChip').onclick = (e) => { e.stopPropagation(); pickerOpen ? closePicker() : openPicker('effort') }
      $('#focusChip').onclick = () => pickDir('focus')
      $('#newOk').onclick = createSession
      $('#newFocusPick').onclick = () => pickDir('new')
      $('#dirUse').onclick = useDir
      $('#dirNone').onclick = async () => {
        if (S.dir.purpose === 'mount') {
          try {
            await api('/api/mount-response', { key: S.dir.key, path: null })
            if (S.live) S.live.cards = S.live.cards.filter((c) => c.key !== S.dir.key)
            renderThread()
          } catch (e) {
            toast(e.message)
          }
        } else if (S.dir.purpose === 'new') {
          $('#newFocus').value = ''
        } else {
          S.dir.path = ''
          await useDir()
          return
        }
        closeSheets()
      }
      $('#jumpBtn').onclick = () => {
        S.stickBottom = true
        scrollBottom(true)
      }

      // 输入内容一变就要切按钮：流式中「有字=发送/插入、无字=停止」全靠这个
      $('#input').addEventListener('input', () => {
        autoGrow()
        renderComposer()
      })
      $('#input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault()
          // 回车：空闲=发送新一轮，运行中=插入当前轮。
          // 运行中按回车时输入框必有内容，所以分发不会落到停止那一支。
          sendOrInsert()
        }
      })

      $('#thread').addEventListener('scroll', () => {
        const el = $('#thread')
        S.stickBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120
        $('#jumpBtn').classList.toggle('is-open', !S.stickBottom)
      })

      document.querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeSheets))
      document.querySelectorAll('.sheet').forEach((s) => {
        s.addEventListener('click', (e) => {
          if (e.target === s) closeSheets()
        })
      })
      window.addEventListener('resize', syncLayout)

      // ───────── 启动 ─────────
      loadSessions().then(async () => {
        // 先备好模型清单，标题里的模型名才不会是原始 id
        try {
          await ensureMeta()
        } catch {}
        syncLayout()
        updateHeader()
        renderSessions()
      })
      connectEvents()
      api('/api/state')
        .then((s) => $('#dot').classList.toggle('on', s.deva === 'running' && s.page))
        .catch(() => {})
    </script>
  </body>
</html>
