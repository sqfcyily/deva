<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e20" />
    <title>Deva</title>
    <style>
      /* 设计 token 直接取自 Deva：apps/desktop/src/renderer/src/styles/tokens.css
         明暗只换这一层，组件层不写死颜色。 */
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas,
          'Courier New', monospace;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;

        --radius-sm: 6px;
        --radius: 8px;
        --radius-lg: 12px;
        --radius-full: 999px;
        --control-h: 34px;

        --bg: #ffffff;
        --bg-panel: #f7f7f8;
        --bg-elevated: #ffffff;
        --bg-inset: #f0f0f2;
        --bg-hover: rgba(0, 0, 0, 0.045);
        --bg-active: rgba(0, 0, 0, 0.08);
        --bg-selected: rgba(91, 91, 214, 0.12);

        --fg: #1f1f24;
        --fg-muted: #5c5c66;
        --fg-subtle: #8a8a94;

        --border: #e6e6ea;
        --border-strong: #d5d5db;

        --accent: #5b5bd6;
        --accent-hover: #4c4cc4;
        --accent-fg: #ffffff;
        --accent-tint: rgba(91, 91, 214, 0.1);

        --chat-user-bubble: #edeffb;

        --success: #2f9e44;
        --warning: #d9860b;
        --danger: #e5484d;
        --info: #3a7bd5;

        --titlebar-bg: #f2f2f4;
        --scrollbar: rgba(0, 0, 0, 0.18);
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.12);

        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --bg: #1e1e20;
        --bg-panel: #252528;
        --bg-elevated: #2a2a2e;
        --bg-inset: #191919;
        --bg-hover: rgba(255, 255, 255, 0.06);
        --bg-active: rgba(255, 255, 255, 0.1);
        --bg-selected: rgba(124, 124, 240, 0.2);

        --fg: #e4e4e7;
        --fg-muted: #a1a1aa;
        --fg-subtle: #71717a;

        --border: #2f2f33;
        --border-strong: #3d3d42;

        --accent: #7c7cf0;
        --accent-hover: #9090f5;
        --accent-fg: #14141a;
        --accent-tint: rgba(124, 124, 240, 0.16);

        --chat-user-bubble: #303043;

        --success: #51cf66;
        --warning: #fcc419;
        --danger: #ff6b6b;
        --info: #74b3ff;

        --titlebar-bg: #1b1b1d;
        --scrollbar: rgba(255, 255, 255, 0.16);
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);

        color-scheme: dark;
      }

      /* ---------- 基础 ---------- */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      /* hidden 属性必须压过下面的 display 声明，否则 <button hidden> 照样显示 */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font: 14px/1.6 var(--font-sans);
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        border-radius: var(--radius);
        height: var(--control-h);
        padding: 0 var(--space-3);
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      button:hover {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* 无边框幽灵按钮：Deva 的组合器 chip 就是这种 */
      .ghost {
        border-color: transparent;
        background: transparent;
        color: var(--fg-muted);
      }
      .ghost:hover {
        background: var(--bg-hover);
        border-color: transparent;
        color: var(--fg);
      }
      .icon-btn {
        width: var(--control-h);
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--fg-muted);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar);
        border-radius: var(--radius-full);
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        flex: 0 0 auto;
        height: 48px;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-3);
        padding-top: env(safe-area-inset-top);
        background: var(--titlebar-bg);
        border-bottom: 1px solid var(--border);
      }
      .topbar__title {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topbar__sub {
        display: block;
        font-weight: 400;
        font-size: 11px;
        color: var(--fg-subtle);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--fg-subtle);
        flex: 0 0 auto;
        transition: background 0.2s;
      }
      .dot.on {
        background: var(--success);
      }

      /* ---------- 视图 ---------- */
      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .view[hidden] {
        display: none;
      }

      /* ---------- 会话列表 ---------- */
      .list-scroll {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-2);
      }
      .list-group {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--fg-subtle);
        padding: var(--space-3) var(--space-3) var(--space-1);
        text-transform: uppercase;
      }
      .srow {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 10px var(--space-3);
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.12s;
      }
      .srow:hover {
        background: var(--bg-hover);
      }
      .srow:active {
        background: var(--bg-active);
      }
      .srow__body {
        flex: 1;
        min-width: 0;
      }
      .srow__title {
        font-size: 14px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1;
      }
      /* 行内标题 + 右上角角色名 */
      .srow__head {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        min-width: 0;
      }
      .srow__role {
        flex: 0 0 auto;
        max-width: 34%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        line-height: 1.5;
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        color: var(--fg-subtle);
      }
      .srow__meta {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: 12px;
        color: var(--fg-subtle);
        margin-top: 2px;
        overflow: hidden;
        white-space: nowrap;
      }
      .srow__meta span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sep {
        opacity: 0.5;
      }
      .srow__focus {
        font-size: 12px;
        color: var(--fg-subtle);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        background: var(--accent-tint);
        color: var(--accent);
        font-size: 11px;
        font-weight: 500;
        flex: 0 0 auto;
      }
      .empty {
        padding: 48px var(--space-4);
        text-align: center;
        color: var(--fg-subtle);
        font-size: 13px;
        line-height: 1.8;
      }

      /* ---------- 对话区 ---------- */
      .thread {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .thread__inner {
        max-width: 860px;
        margin: 0 auto;
        padding: var(--space-5) var(--space-4) var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      /* 消息行：左边头像 + 右边内容。用户的气泡靠右，助手的通栏 */
      .msg {
        display: flex;
        gap: var(--space-3);
        min-width: 0;
      }
      .msg--user {
        justify-content: flex-end;
        align-items: flex-start;
      }
      /* 用户这一侧：正文与附件竖排。之前附件直接当 flex 兄弟，把正文挤成一条竖缝 */
      .msg--user .turn {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-2);
        max-width: 88%;
        min-width: 0;
      }
      .msg__body,
      .turn,
      .blk {
        min-width: 0;
      }
      .bubble--user {
        max-width: 100%;
        /* 短句不能被拆成一字一行：给一个最小宽度（约 4 个字），
           flex 收缩时不会把「重试」压成竖排 */
        min-width: min(4em, 100%);
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: normal;
      }
      .msg--agent {
        align-items: flex-start;
      }
      .msg--agent .msg__body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      /* 头像：底板形状由 SVG 自己决定（闲置=圆，生成中=星芒），外层不做圆形裁剪，
         否则星芒的八个角会被切掉。 */
      .ava {
        width: var(--sz, 28px);
        height: var(--sz, 28px);
        flex: 0 0 auto;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        overflow: visible;
      }
      .ava > svg,
      .ava__img {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ava__img {
        border-radius: var(--radius-full);
        object-fit: cover;
      }
      /* 运行中只有底板轻微呼吸，人物不旋转；结束移除 is-busy 并恢复圆形。 */
      .ava.is-busy > svg .ava__plate {
        animation: ava-plate-breathe 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes ava-plate-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .78; transform: scale(.95); }
      }
      .msg .ava { overflow: hidden; border-radius: 50%; }
      .srow { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
      /* 列表里的头像大一点，29px 太挤 */
      .srow .ava {
        --sz: 34px;
        margin-top: 1px;
      }
      .ava--user {
        background: var(--accent-tint);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }
      .msg__name {
        font-size: 12px;
        color: var(--fg-subtle);
        margin-bottom: 2px;
      }
      .bubble--user {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: var(--radius-lg);
        border-top-right-radius: var(--radius-sm);
        background: var(--chat-user-bubble);
        color: var(--fg);
        white-space: pre-wrap;
        /* 短文本别被逐字拆行（word-break: break-word 会随便断），只在放不下时按词断 */
        word-break: normal;
        overflow-wrap: break-word;
        user-select: text;
      }
      /* 助手消息内各块竖排，块间留距 */
      .msg--agent {
        gap: var(--space-3);
      }
      .blk {
        min-width: 0;
      }
      .msg__content {
        width: 100%;
        min-width: 0;
        user-select: text;
      }
      .attach {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        margin-top: var(--space-2);
      }
      .msg--user .attach {
        margin-top: 0;
        justify-content: flex-end;
      }
      .attach__img {
        display: block;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--bg-inset);
        line-height: 0;
        padding: 0;
        cursor: zoom-in;
      }
      .attach__img img {
        display: block;
        /* 缩略图要完整：按比例装进框里，绝不裁掉两边（之前是 fill + overflow:hidden，被切了一截） */
        object-fit: contain;
        /* 手机上图太小会看不出来是什么，给足宽度：竖图按高度收，横图按宽度收 */
        max-width: min(260px, 70vw);
        max-height: min(320px, 42vh);
        width: auto;
        height: auto;
        background: var(--bg-inset);
      }
      .attach__item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 8px;
        border-radius: var(--radius-sm);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        color: var(--fg-muted);
        font-size: 12px;
      }

      /* ---------- Markdown ---------- */
      .md {
        font-size: 14px;
        line-height: 1.65;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0 0 var(--space-3);
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4 {
        margin: var(--space-4) 0 var(--space-2);
        font-weight: 650;
        line-height: 1.35;
      }
      .md h1 {
        font-size: 19px;
      }
      .md h2 {
        font-size: 17px;
      }
      .md h3 {
        font-size: 15px;
      }
      .md h4 {
        font-size: 14px;
      }
      .md ul,
      .md ol {
        margin: 0 0 var(--space-3);
        padding-left: var(--space-5);
      }
      .md li {
        margin: 3px 0;
      }
      .md li::marker {
        color: var(--fg-subtle);
      }
      .md a {
        color: var(--accent);
        text-decoration: none;
      }
      .md a:hover {
        text-decoration: underline;
      }
      .md code {
        font-family: var(--font-mono);
        font-size: 0.9em;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1px 5px;
      }
      .md pre {
        margin: 0 0 var(--space-3);
        padding: var(--space-3);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
        line-height: 1.55;
      }
      .md pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 12.5px;
      }
      .md blockquote {
        margin: 0 0 var(--space-3);
        padding: var(--space-1) 0 var(--space-1) var(--space-3);
        border-left: 2px solid var(--border-strong);
        color: var(--fg-muted);
      }
      .md strong {
        font-weight: 600;
      }
      .md hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: var(--space-4) 0;
      }
      .md table {
        border-collapse: collapse;
        margin: 0 0 var(--space-3);
        font-size: 13px;
        display: block;
        overflow-x: auto;
      }
      .md th,
      .md td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }
      .md th {
        background: var(--bg-inset);
        font-weight: 600;
      }

      /* ---------- 状态行 / 工具行 ---------- */
      .status {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--fg-subtle);
        font-size: 13px;
      }
      .spin {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--border-strong);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .toolline {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--fg-subtle);
        font-size: 13px;
        min-width: 0;
      }
      .toolline__name {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-muted);
      }
      .toolline__arg {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .notice {
        font-size: 12.5px;
        color: var(--fg-subtle);
      }
      .notice--error {
        color: var(--danger);
      }
      .notice--warn {
        color: var(--warning);
      }
      .duration {
        margin-top: var(--space-2);
        font-size: 12px;
        color: var(--fg-subtle);
      }

      /* ---------- 卡片（问答 / 计划 / 挂载） ---------- */
      /* 卡片是对话流里的一等元素：上下都要有间距，不能和正文贴在一起 */
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--bg-panel);
        overflow: hidden;
        margin: 0;
        min-width: 0;
      }
      .msg--agent > .card + .md,
      .msg--agent > .md + .card,
      .msg--agent > .card + .card {
        margin-top: var(--space-4);
      }
      .msg--agent > .card + .md {
        margin-top: var(--space-4);
      }
      .card__head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-3) 0;
        font-size: 13px;
        font-weight: 600;
      }
      .card__head .badge {
        height: 18px;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        font-size: 11px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        background: var(--accent-tint);
        color: var(--accent);
      }
      .card__body {
        padding: var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      .card__foot {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-2);
        padding: 0 var(--space-3) var(--space-3);
      }
      /* 已决态：整体压暗一点，但答案要读得清 */
      .card--done {
        background: transparent;
      }
      .card--done .card__head {
        color: var(--fg-muted);
      }
      .card--done .badge {
        background: var(--bg-inset);
        color: var(--fg-subtle);
      }
      .q__title {
        font-size: 13.5px;
        line-height: 1.6;
      }
      .q__hint {
        font-size: 12px;
        color: var(--fg-subtle);
        line-height: 1.5;
      }
      /* 已决问答：题与答成对显示，答句用正文色、略缩进 */
      .qa {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .qa__q {
        font-size: 13px;
        color: var(--fg-muted);
      }
      .qa__a {
        font-size: 13.5px;
        color: var(--fg);
        padding-left: var(--space-3);
        border-left: 2px solid var(--border-strong);
      }
      .qa__a--empty {
        color: var(--fg-subtle);
      }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-elevated);
        margin-top: 6px;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .opt:hover {
        border-color: var(--border-strong);
      }
      .opt.is-on {
        border-color: var(--accent);
        background: var(--accent-tint);
      }
      .opt input {
        margin: 4px 0 0;
        accent-color: var(--accent);
      }
      .opt__label {
        font-size: 13px;
        line-height: 1.5;
      }
      .opt__desc {
        font-size: 12px;
        color: var(--fg-subtle);
        line-height: 1.5;
      }
      .field {
        width: 100%;
      }
      input[type='text'],
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--bg-elevated);
        padding: 7px 10px;
        outline: none;
        transition: border-color 0.15s;
      }
      input[type='text']:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 64px;
        line-height: 1.6;
      }
      select {
        height: var(--control-h);
        padding: 0 var(--space-2);
      }
      .planview {
        margin: 0;
        padding: var(--space-3);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font: 12.5px/1.6 var(--font-mono);
        max-height: 46vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .card__foot .primary,
      .primary-btn {
        background: var(--accent);
        border-color: transparent;
        color: var(--accent-fg);
        font-weight: 500;
      }
      .primary-btn:hover {
        background: var(--accent-hover);
      }
      .card__foot button {
        height: 32px;
        padding: 0 var(--space-3);
        font-size: 13px;
      }

      /* 待发送的图片：横排小缩略图，可单张移除 */
      .pending-imgs {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        padding: var(--space-1) 0 var(--space-2);
      }
      .pending-imgs:empty {
        display: none;
      }
      .pimg {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--bg-inset);
      }
      .pimg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pimg__doc {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
        color: var(--fg-subtle);
      }
      .pending-files {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        padding: 0 0 var(--space-2);
      }
      .pending-files:empty {
        display: none;
      }
      .pimg__x {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.62);
        color: #fff;
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      /* 对齐桌面端 ProcessFold：名字、处理标题、箭头同行，无外框或背景。 */
      .fold {
        border: none;
        border-radius: 0;
        background: transparent;
        min-width: 0;
      }
      .process-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
        min-width: 0;
        min-height: 22px;
      }
      .process-row .msg__name {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--fg);
      }
      .fold__head,
      .process-status {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        width: fit-content;
        max-width: 100%;
        min-width: 0;
        padding: 2px 0;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--fg-subtle);
        font-size: 12.5px;
        line-height: 1.6;
        text-align: left;
        height: auto;
      }
      .fold__head:hover {
        background: transparent;
        border: none;
        color: var(--fg-muted);
      }
      .process-time {
        font-variant-numeric: tabular-nums;
      }
      .fold__caret {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        transition: transform 0.15s;
        flex: 0 0 auto;
      }
      .fold.is-open .fold__caret {
        transform: rotate(180deg);
      }
      .fold__body {
        display: none;
        padding: 8px 0 0;
        border: none;
      }
      .fold.is-open .fold__body {
        display: block;
      }
      .fold__line {
        display: flex;
        gap: 6px;
        font-size: 12.5px;
        color: var(--fg-subtle);
        padding: 3px 0;
        min-width: 0;
      }
      .fold__line b {
        font-weight: 500;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--fg-muted);
        flex: 0 0 auto;
      }
      .fold__line span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      /* 任务完成的小红点：挂在角色头像右上角 */
      .ava__dot {
        position: absolute;
        top: -1px;
        right: -1px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 2px var(--bg);
        pointer-events: none;
      }
      .srow .ava__dot {
        box-shadow: 0 0 0 2px var(--bg-panel);
      }

      /* 交付文件 */
      .files {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--bg-panel);
        overflow: hidden;
      }
      .files__head {
        padding: 9px 12px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--fg-muted);
        border-bottom: 1px solid var(--border);
      }
      .filerow {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        min-width: 0;
      }
      .filerow:last-child {
        border-bottom: none;
      }
      .filerow:hover {
        background: var(--bg-hover);
      }
      .filerow__ico {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: var(--radius);
        background: var(--bg-inset);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        color: var(--fg-subtle);
      }
      .filerow__body {
        flex: 1;
        min-width: 0;
      }
      .filerow__name {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filerow__meta {
        font-size: 11.5px;
        color: var(--fg-subtle);
      }
      .filerow__gone {
        color: var(--danger);
      }

      /* 文件查看器 */
      #viewer .sheet__panel {
        max-width: 900px;
        height: 88vh;
        max-height: 88vh;
      }
      #viewer .sheet__body {
        padding: 0;
        overflow: hidden;
      }
      .viewer__pre {
        margin: 0;
        height: 100%;
        overflow: auto;
        padding: var(--space-3);
        background: var(--bg-inset);
        font: 12.5px/1.6 var(--font-mono);
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      .viewer__img {
        display: block;
        max-width: 100%;
        margin: 0 auto;
        padding: var(--space-3);
      }
      #viewerFrame {
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
      }
      .viewer__note {
        padding: var(--space-3);
        font-size: 12.5px;
        color: var(--fg-subtle);
      }

      .ctxmenu__ico {
        width: 20px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--fg-muted);
        font-size: 14px;
      }
      .ctxmenu__item--danger .ctxmenu__ico {
        color: var(--danger);
      }

      /* 长按菜单 */
      .ctxmenu {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
      }
      .ctxmenu.is-open {
        display: flex;
      }
      .ctxmenu__box {
        width: 100%;
        max-width: 560px;
        background: var(--bg-elevated);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: var(--space-2) var(--space-2) max(var(--space-4), env(safe-area-inset-bottom));
        border: 1px solid var(--border);
        border-bottom: none;
      }
      .ctxmenu__title {
        padding: var(--space-2) var(--space-3);
        font-size: 12px;
        color: var(--fg-subtle);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ctxmenu__item {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        width: 100%;
        padding: 12px var(--space-3);
        border: none;
        background: transparent;
        border-radius: var(--radius);
        font-size: 14px;
        color: var(--fg);
        height: auto;
        text-align: left;
      }
      .ctxmenu__item:hover {
        background: var(--bg-hover);
      }
      .ctxmenu__item--danger {
        color: var(--danger);
      }

      /* 图片全屏层 */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      .lightbox.is-open {
        display: flex;
      }
      .lightbox__img {
        max-width: 100vw;
        max-height: 100%;
        object-fit: contain;
        -webkit-user-select: none;
        user-select: none;
      }
      .lightbox__close {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        right: 10px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 17px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lightbox__close:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      /* 模型 / 思考强度选择菜单（照桌面端）：贴着 chip 上方弹出，
         分组标题 + 选项 + 当前项打勾，无外层阴影边框堆叠。 */
      .picker {
        position: fixed;
        z-index: 300;
        max-width: min(320px, 92vw);
      }
      .picker__box {
        max-height: min(60vh, 420px);
        overflow-y: auto;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 4px;
        min-width: 180px;
      }
      .picker__group + .picker__group {
        border-top: 1px solid var(--border);
        margin-top: 2px;
        padding-top: 2px;
      }
      .picker__head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--fg-subtle);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .picker__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--fg-subtle);
        flex: 0 0 auto;
      }
      /* 当前模型所在的供应商：圆点用主题蓝，一眼看出选的是哪一家 */
      .picker__dot.is-current {
        background: var(--accent);
      }
      .picker__item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        padding: 9px 10px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg);
        font-size: 13.5px;
        text-align: left;
        height: auto;
      }
      .picker__item:hover {
        background: var(--bg-hover);
        border: none;
      }
      .picker__item.is-active {
        color: var(--accent);
        font-weight: 500;
      }
      .picker__label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .picker__check {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- 输入区 ---------- */
      .composer {
        flex: 0 0 auto;
        border-top: 1px solid var(--border);
        background: var(--bg);
        padding: var(--space-3) var(--space-3);
        padding-bottom: max(var(--space-3), env(safe-area-inset-bottom));
      }
      .composer__box {
        max-width: 860px;
        margin: 0 auto;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background: var(--bg-elevated);
        padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
        transition: border-color 0.15s;
      }
      .composer__box:focus-within {
        border-color: var(--accent);
      }
      .composer__input {
        width: 100%;
        border: none;
        background: transparent;
        outline: none;
        resize: none;
        max-height: 160px;
        min-height: 24px;
        padding: var(--space-1) 0;
        line-height: 1.6;
        user-select: text;
      }
      .composer__input::placeholder {
        color: var(--fg-subtle);
      }
      .composer__toolbar {
        display: flex;
        align-items: center;
        /* 手机横向寸土寸金：右侧一组之间几乎贴住，省下的宽度全给模型名 */
        gap: 0;
        margin-top: var(--space-1);
        min-width: 0;
      }
      /* 发送键不能被挤走：不让它收缩 */
      .composer__toolbar .send {
        flex: 0 0 auto;
      }
      .composer__toolbar .chip {
        min-width: 0;
        flex: 0 1 auto;
        padding: 0 3px;
        gap: 3px;
        font-size: 12px;
      }
      /* 模型名与思考强度各自只剩内侧一点留白，让两者贴得更近 */
      #modelChip {
        padding-right: 1px;
        gap: 2px;
      }
      #effortChip {
        padding-left: 1px;
      }
      .composer__toolbar .send {
        margin-left: 4px;
      }
      /* 宽度分配（照桌面端截图）：
         空白只放在左侧那一组与右侧那一组之间；右侧「模型 · 思考强度 · 发送」整组贴右，
         模型名只占自己的文字宽度——名字变长时整组向左延伸，尾部始终紧贴「思考强度」。 */
      .composer__spacer {
        flex: 1 1 auto;
        min-width: 2px;
      }
      #attachChip,
      #focusChip,
      #effortChip,
      .composer__toolbar .send {
        flex: 0 0 auto;
      }
      /* 不设 flex:1，否则盒子会被拉满、文字与「思考强度」之间留出空档 */
      #modelChip {
        flex: 0 1 auto;
        min-width: 0;
      }
      #modelChip .chip__text {
        max-width: none;
      }
      #effortChip .chip__text {
        max-width: none;
      }
      /* chip：Deva 组合器底部那种无边框小按钮 */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        max-width: 100%;
        padding: 0 8px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background: transparent;
        color: var(--fg-muted);
        font-size: 12px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .chip:hover {
        background: var(--bg-hover);
        color: var(--fg);
      }
      .chip__text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /* 模型名常带 group/ 之类的分组前缀，留太长会把工具栏挤满 */
        max-width: 110px;
      }
      /* 纯图标入口（附件 / 挂载）：只占图标宽度，把空间让给模型名 */
      .chip--icon {
        width: 28px;
        padding: 0;
        justify-content: center;
        flex: 0 0 auto;
      }
      /* 挂载后要能看出挂到哪儿，这时才展开显示文件夹名 */
      .chip--icon.has-text {
        width: auto;
        padding: 0 6px;
        gap: 4px;
      }
      /* 只读提示 chip：运行中「已插入、等送到」的条数 */
      .chip--hint {
        cursor: default;
        color: var(--accent);
        background: var(--accent-tint);
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip--hint:hover {
        background: var(--accent-tint);
        color: var(--accent);
      }
      .chip__plus {
        font-size: 17px;
        line-height: 1;
        color: var(--fg-muted);
      }
      .chip--icon:hover .chip__plus {
        color: var(--fg);
      }

      /* 附件选择菜单 */
      .attachmenu {
        position: fixed;
        z-index: 60;
        min-width: 168px;
        padding: 6px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        display: none;
      }
      .attachmenu.is-open {
        display: block;
      }
      .attachmenu__item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        width: 100%;
        padding: 9px 10px;
        border: none;
        background: transparent;
        border-radius: var(--radius);
        font-size: 13.5px;
        text-align: left;
        color: var(--fg);
        height: auto;
      }
      .attachmenu__item:hover {
        background: var(--bg-hover);
      }
      .attachmenu__ico {
        width: 17px;
        color: var(--fg-subtle);
        text-align: center;
        flex: 0 0 auto;
      }
      .send {
        height: 30px;
        min-width: 58px;
        padding: 0 14px;
        border-radius: var(--radius);
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-fg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s,
          opacity 0.15s;
      }
      .dot-sm {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: 0 0 auto;
      }
      /* 工具条里的线性图标（照桌面端 Lucide 尺寸，16 / 13） */
      .ico {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #effortChip .ico {
        width: 14px;
        height: 14px;
      }
      .chip__caret {
        width: 11px;
        height: 11px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.75;
      }
      .send:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      /* 运行中：发送键变成「插入」（只插话），停止是右边那颗独立的红方块。
         两者绝不共用一颗按钮——以前运行中把发送键刷成红色停止键，手机上根本分不清。 */
      .send--insert {
        background: var(--accent-tint);
        color: var(--accent);
        border-color: var(--accent);
      }
      .send--insert:hover:not(:disabled) {
        background: var(--accent-tint);
        opacity: 0.86;
      }
      /* 停止态：照桌面端，同一枚键在「有字=发送 / 空=intended 停止」之间切换 */
      .send--stop {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .send--stop:hover:not(:disabled) {
        background: var(--accent-hover);
        opacity: 1;
      }
      .send__stopicon {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: currentColor;
        display: block;
      }
      /* 待插入胶囊（照桌面端 .cf-ins__*）：输入框上方独占一行，右侧可撤回 */
      .chip--hint {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        max-width: none;
        height: 30px;
        margin-bottom: 4px;
        padding: 0 4px 0 8px;
        background: var(--bg-inset);
        border-color: var(--border);
        border-radius: var(--radius);
        cursor: default;
      }
      .chip--hint:hover {
        background: var(--bg-inset);
      }
      .chip__pending {
        flex: none;
        color: var(--accent);
        font-size: 11.5px;
      }
      .chip__pendingtext {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        color: var(--fg-muted);
      }
      .chip__withdraw {
        flex: none;
        height: 20px;
        padding: 0 8px;
        font-size: 11.5px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--fg-muted);
      }
      .chip__withdraw:hover {
        color: var(--fg);
        border-color: var(--border-strong);
      }

      /* ---------- 弹层 ---------- */
      .sheet {
        position: fixed;
        inset: 0;
        z-index: var(--z-overlay, 100);
        display: none;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
      }
      .sheet.is-open {
        display: flex;
      }
      .sheet__panel {
        width: 100%;
        max-width: 560px;
        max-height: 86vh;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        box-shadow: var(--shadow);
        padding-bottom: env(safe-area-inset-bottom);
        animation: rise 0.18s ease-out;
      }
      @keyframes rise {
        from {
          transform: translateY(12px);
          opacity: 0.6;
        }
      }
      .sheet__head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-4) var(--space-4) var(--space-2);
        font-size: 14px;
        font-weight: 600;
      }
      .sheet__body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 var(--space-4) var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .sheet__foot {
        display: flex;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4) var(--space-4);
        border-top: 1px solid var(--border);
      }
      .sheet__foot button {
        flex: 1;
      }
      .sheet__foot .primary {
        background: var(--accent);
        border-color: transparent;
        color: var(--accent-fg);
        font-weight: 500;
      }
      .sheet__foot .primary:hover {
        background: var(--accent-hover);
      }
      .lbl {
        display: block;
        font-size: 12px;
        color: var(--fg-subtle);
        margin-bottom: 6px;
      }

      /* 目录浏览 */
      .pathbar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 7px 10px;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font: 12px/1.5 var(--font-mono);
        color: var(--fg-muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .dirlist {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .dirrow {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 10px var(--space-3);
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        font-size: 13.5px;
      }
      .dirrow:last-child {
        border-bottom: none;
      }
      .dirrow:hover {
        background: var(--bg-hover);
      }
      .dirrow__ico {
        color: var(--fg-subtle);
        flex: 0 0 auto;
      }
      .dirrow__name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 6px);
        z-index: 1000;
        max-width: min(90vw, 420px);
        padding: 8px 14px;
        border-radius: var(--radius-lg);
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow);
        color: var(--fg);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s;
      }
      .toast.is-open {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* 回到最新 */
      .jump {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-bottom: var(--space-2);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow);
        color: var(--fg-muted);
        z-index: 5;
      }
      .jump.is-open {
        display: inline-flex;
      }

      /* 宽屏：列表与对话并排，像桌面端那样 */
      @media (min-width: 900px) {
        .body {
          display: flex;
          flex: 1;
          min-height: 0;
        }
        .sidebar {
          width: 280px;
          flex: 0 0 280px;
          border-right: 1px solid var(--border);
          background: var(--bg-panel);
          display: flex;
          flex-direction: column;
          min-height: 0;
        }
        .main {
          flex: 1;
          min-width: 0;
          display: flex;
          flex-direction: column;
        }
        .sheet {
          align-items: center;
        }
        .sheet__panel {
          border-radius: var(--radius-lg);
          border-bottom: 1px solid var(--border);
          margin-bottom: 8vh;
        }
      }
      @media (max-width: 899px) {
        .body {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }
        .sidebar,
        .main {
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }
        .sidebar[hidden],
        .main[hidden] {
          display: none;
        }
      }
      /* ---------- 手机端专项 ---------- */
      @media (max-width: 640px) {
        /* 输入框上沿留出呼吸，避免长回复把最后一行顶到边缘 */
        .thread__inner {
          padding: var(--space-4) var(--space-3) var(--space-3);
          gap: var(--space-4);
        }
        /* 顶栏压缩，给内容让位 */
        .topbar {
          height: 44px;
          padding: 0 var(--space-2);
          padding-top: env(safe-area-inset-top);
        }
        .topbar__title {
          font-size: 14px;
        }
        /* 卡片按钮在窄屏撑满、竖排更易点中 */
        .card__foot {
          flex-wrap: wrap;
          padding: 0 var(--space-3) var(--space-3);
        }
        .card__foot button {
          flex: 1 1 0;
          min-width: 96px;
          height: 36px;
        }
        /* 选项做成整行可点，触控目标 ≥ 40px */
        .opt {
          padding: 10px;
        }
        .opt input {
          width: 18px;
          height: 18px;
          margin-top: 2px;
        }
        /* 输入框与按钮加大 */
        .composer {
          padding: var(--space-2) var(--space-2);
          padding-bottom: max(var(--space-2), env(safe-area-inset-bottom));
        }
        .composer__input {
          font-size: 16px; /* 低于 16px 时 iOS 会在聚焦后放大页面 */
          min-height: 26px;
        }
        .send {
          width: 34px;
          height: 34px;
          border-radius: var(--radius);
        }
        .chip {
          height: 30px;
          font-size: 12.5px;
        }
        .chip__text {
          max-width: 96px;
        }
        /* 气泡更宽一点，长段落别挤成细条 */
        .bubble--user {
          max-width: 88%;
          padding: 9px 12px;
        }
        /* 计划预览别把整屏吃掉 */
        .planview {
          max-height: 38vh;
        }
        /* 弹层几乎全屏，键盘弹起时更好用 */
        .sheet__panel {
          max-height: 92vh;
          min-height: 52vh;
        }
        .sheet__head {
          padding: var(--space-3) var(--space-3) var(--space-1);
        }
        .sheet__body {
          padding: 0 var(--space-3) var(--space-2);
          gap: var(--space-3);
        }
        .sheet__foot {
          padding: var(--space-2) var(--space-3) var(--space-3);
        }
        .dirrow {
          padding: 12px var(--space-3);
        }
        .toast {
          bottom: 88px;
        }
        /* 会话行：标题两行也能忍，元信息不换行 */
        .srow {
          padding: 11px var(--space-2);
        }
      }

      /* 很矮的横屏：进一步压缩纵向占位 */
      @media (max-height: 520px) {
        .thread__inner {
          gap: var(--space-3);
        }
        .composer__input {
          max-height: 72px;
        }
        .planview {
          max-height: 30vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="ghost icon-btn" id="backBtn" aria-label="返回" hidden>‹</button>
      <div class="topbar__title">
        <span id="titleText">Deva</span>
        <span class="topbar__sub" id="subText"></span>
      </div>
      <span class="dot" id="dot" title="连接状态"></span>
      <button class="ghost icon-btn" id="themeBtn" aria-label="切换主题" title="切换明暗">◐</button>
      <button class="ghost icon-btn" id="newBtn" aria-label="新建会话" title="新建会话">＋</button>
    </div>

    <div class="body">
      <!-- 会话列表 -->
      <aside class="sidebar" id="sidebar">
        <div class="list-scroll" id="sessionList"></div>
      </aside>

      <!-- 对话 -->
      <main class="main" id="main" hidden>
        <div class="thread" id="thread">
          <div class="thread__inner" id="threadInner"></div>
        </div>
        <div class="composer">
          <button class="jump" id="jumpBtn" aria-label="回到最新">↓</button>
          <div class="composer__box">
            <div class="pending-imgs" id="pendingImgs"></div>
            <!-- 待插入胶囊：独立一行放在输入框**上方**（照桌面端），不跟工具栏挤在一起 -->
            <div class="chip chip--hint" id="insertChip" hidden></div>
            <textarea
              id="input"
              class="composer__input"
              rows="1"
              placeholder="交代一个目标，或 @角色 / /命令"
            ></textarea>
            <!-- 底部工具条：照桌面端——左侧「回形针 + 挂载文件夹」，右侧「模型 · 思考强度 · 发送」 -->
            <div class="composer__toolbar">
              <button class="chip chip--icon" id="attachChip" title="附件" aria-label="附件">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
              <button class="chip chip--icon" id="focusChip" title="挂载工作区" aria-label="挂载工作区">
                <!-- 文件夹上带加号（桌面端 FolderPlus） -->
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10v6M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                <span class="chip__text" id="focusText" hidden></span>
              </button>
              <div class="composer__spacer"></div>
              <button class="chip" id="modelChip" title="切换模型">
                <span class="dot-sm"></span><span class="chip__text" id="modelText">模型</span>
                <svg class="chip__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <button class="chip" id="effortChip" title="思考强度">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
                <span class="chip__text" id="effortText">思考强度</span>
              </button>
              <!-- 只有一枚键：空闲=发送；流式中输入框有字=发送（插入当前轮），空=停止 -->
              <button class="send" id="sendBtn" type="button" aria-label="发送">发送</button>
            </div>
          </div>
          <!-- 手机上会直接弹出相册/拍照；桌面端是选文件 -->
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <!-- 任意文件：PDF、文本、代码等，类型识别交给 Deva -->
          <input type="file" id="fileInputAny" multiple hidden />
        </div>
      </main>
    </div>

    <!-- 新建会话 -->
    <div class="sheet" id="newSheet">
      <div class="sheet__panel" role="dialog" aria-label="新建会话">
        <div class="sheet__head">新建会话</div>
        <div class="sheet__body">
          <div>
            <label class="lbl" for="newPersona">角色</label>
            <select id="newPersona"></select>
          </div>
          <div>
            <label class="lbl" for="newModel">模型</label>
            <select id="newModel"></select>
          </div>
          <div>
            <label class="lbl" for="newFocus">工作目录</label>
            <div style="display: flex; gap: 8px">
              <input type="text" id="newFocus" placeholder="留空 = 全机通用" readonly />
              <button id="newFocusPick" style="flex: 0 0 auto">选择</button>
            </div>
          </div>
        </div>
        <div class="sheet__foot">
          <button data-close>取消</button>
          <button class="primary" id="newOk">创建</button>
        </div>
      </div>
    </div>

    <!-- 目录浏览 -->
    <div class="sheet" id="dirSheet">
      <div class="sheet__panel" role="dialog" aria-label="选择目录">
        <div class="sheet__head" id="dirTitle">选择目录</div>
        <div class="sheet__body">
          <div class="pathbar" id="dirPath"></div>
          <div class="dirlist" id="dirList"></div>
        </div>
        <div class="sheet__foot">
          <button id="dirNone">不挂载</button>
          <button class="primary" id="dirUse">用这个目录</button>
        </div>
      </div>
    </div>

    <div class="attachmenu" id="attachMenu">
      <button class="attachmenu__item" data-kind="image">
        <span class="attachmenu__ico">◫</span><span>图片</span>
      </button>
      <button class="attachmenu__item" data-kind="file">
        <span class="attachmenu__ico">▤</span><span>文件</span>
      </button>
    </div>

    <!-- 长按会话：归档 / 删除（和桌面端一致） -->
    <div class="ctxmenu" id="ctxMenu">
      <div class="ctxmenu__box">
        <div class="ctxmenu__title" id="ctxTitle"></div>
        <!-- 照桌面端右键菜单：新建对话 / 重命名 / 归档对话 / 删除对话 -->
        <button class="ctxmenu__item" data-act="new">
          <span class="ctxmenu__ico">＋</span><span>新建对话</span>
        </button>
        <button class="ctxmenu__item" data-act="rename">
          <span class="ctxmenu__ico">✎</span><span>重命名</span>
        </button>
        <button class="ctxmenu__item" data-act="archive">
          <span class="ctxmenu__ico">▣</span><span id="ctxArchiveText">归档对话</span>
        </button>
        <button class="ctxmenu__item ctxmenu__item--danger" data-act="delete">
          <span class="ctxmenu__ico">🗑</span><span>删除对话</span>
        </button>
      </div>
    </div>

    <!-- 重命名对话 -->
    <div class="sheet" id="renameSheet">
      <div class="sheet__panel" role="dialog" aria-label="重命名对话">
        <div class="sheet__head">重命名对话</div>
        <div class="sheet__body">
          <div>
            <input type="text" id="renameInput" placeholder="留空则恢复默认标题" />
          </div>
        </div>
        <div class="sheet__foot">
          <button data-close>取消</button>
          <button class="primary" id="renameOk">确定</button>
        </div>
      </div>
    </div>

    <!-- 交付文件查看器 -->
    <div class="sheet" id="viewer">
      <div class="sheet__panel" role="dialog" aria-label="查看文件">
        <div class="sheet__head">
          <span id="viewerTitle" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"></span>
          <button class="ghost icon-btn" data-close aria-label="关闭">✕</button>
        </div>
        <div class="sheet__body" id="viewerBody"></div>
      </div>
    </div>

    <!-- 图片全屏查看：站内层，点 ✕ 或空白处关闭 -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox__close" id="lightboxClose" aria-label="关闭">✕</button>
      <img class="lightbox__img" id="lightboxImg" alt="">
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = (s) => document.querySelector(s)

      const EFFORTS = [
        ['default', '默认'],
        ['low', '低'],
        ['medium', '中'],
        ['high', '高'],
        ['xhigh', '极高']
      ]

      /** 档位值 → 中文（工具条上显示「高」而不是 raw 的 xhigh）。 */
      /**
       * 本会话的思考强度。
       *
       * 优先级：本地刚切换过的记忆 → 会话自身（服务端带来）→ 全局默认。
       * 之所以要第一层：loadSessions 每次会整体替换 S.sessions，而切换后到下一次轮询之间
       * 界面不该闪回旧值；记忆只在本页存活，刷新后以会话上的值为准。
       */
      const effortMemo = {}
      function effectiveEffort() {
        return effortMemo[S.sessionId] || S.meta?.effort || S.models.activeEffort || 'default'
      }

      function effortLabel(v) {
        const hit = EFFORTS.find(([k]) => k === v)
        return hit ? hit[1] : v || '默认'
      }

      // 网页通过 ?key= 首次进入后由服务端种了同名 cookie；<img> 带不上自定义头，
      // 所以图片 URL 显式带上同一个 key。
      const GATEWAY_KEY = new URLSearchParams(location.search).get('key') || ''

      // 最近一次收到本会话流事件的时间：用于判断服务端快照是否比本地还旧。
      let lastStreamAt = 0

      const S = {
        view: 'list',
        sessions: [],
        models: { providers: [], activeModelId: null, activeEffort: 'default' },
        personas: [],
        sessionId: null,
        meta: null,
        turnId: null,
        /** 当前这一轮里已插入、还没送到的文字（主进程 inserts 事件） */
        inserts: [],
        messages: [],
        live: null,
        dir: { path: '', purpose: 'focus', key: null },
        /** 待发送的图片：{ data: dataURL, preview, name } */
        pending: [],
        stickBottom: true
      }

      // ───────── 主题：跟随系统，可手动覆盖 ─────────
      const THEME_KEY = 'deva.gateway.theme'
      function applyTheme(pref) {
        const dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#1e1e20' : '#ffffff')
      }
      let themePref = localStorage.getItem(THEME_KEY) || 'system'
      applyTheme(themePref)
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (themePref === 'system') applyTheme(themePref)
      })
      $('#themeBtn').onclick = () => {
        const order = ['system', 'dark', 'light']
        themePref = order[(order.indexOf(themePref) + 1) % order.length]
        localStorage.setItem(THEME_KEY, themePref)
        applyTheme(themePref)
        toast(themePref === 'system' ? '跟随系统' : themePref === 'dark' ? '深色' : '浅色')
      }

      // ───────── 小工具 ─────────
      let toastTimer
      function toast(msg) {
        const t = $('#toast')
        t.textContent = msg
        t.classList.add('is-open')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => t.classList.remove('is-open'), 2400)
      }

      async function api(path, body) {
        const opt =
          body === undefined
            ? {}
            : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
        const r = await fetch(path, opt)
        const j = await r.json().catch(() => ({}))
        if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status)
        return j
      }

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

      function relTime(ms) {
        if (!ms) return ''
        const d = Date.now() - ms
        if (d < 60000) return '刚刚'
        if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前'
        if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前'
        const dt = new Date(ms)
        const sameYear = dt.getFullYear() === new Date().getFullYear()
        return sameYear
          ? `${dt.getMonth() + 1}月${dt.getDate()}日`
          : `${dt.getFullYear()}/${dt.getMonth() + 1}/${dt.getDate()}`
      }

      // ───────── Markdown（够用即可，不做完整解析） ─────────
      function inline(s) {
        return esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(（])\*([^*\n]+)\*/g, '$1<em>$2</em>')
          .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
      }

      function renderMd(src) {
        const segs = String(src ?? '').split(/```/)
        let out = ''
        let para = []
        const flushPara = () => {
          if (para.length) {
            out += '<p>' + para.map(inline).join('<br>') + '</p>'
            para = []
          }
        }
        segs.forEach((seg, i) => {
          if (i % 2 === 1) {
            const nl = seg.indexOf('\n')
            const code = nl >= 0 ? seg.slice(nl + 1) : seg
            out += '<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>'
            return
          }
          const lines = seg.split('\n')
          let listTag = null
          let inTable = false
          const closeList = () => {
            if (listTag) {
              out += '</' + listTag + '>'
              listTag = null
            }
          }
          for (const raw of lines) {
            const line = raw.replace(/\s+$/, '')
            const t = line.trim()
            if (!t) {
              closeList()
              flushPara()
              continue
            }
            const h = /^(#{1,4})\s+(.*)$/.exec(t)
            if (h) {
              closeList()
              flushPara()
              out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`
              continue
            }
            if (/^(-{3,}|\*{3,})$/.test(t)) {
              closeList()
              flushPara()
              out += '<hr>'
              continue
            }
            const ul = /^[-*+]\s+(.*)$/.exec(t)
            const ol = /^\d+[.)]\s+(.*)$/.exec(t)
            if (ul || ol) {
              flushPara()
              const want = ul ? 'ul' : 'ol'
              if (listTag !== want) {
                closeList()
                out += '<' + want + '>'
                listTag = want
              }
              out += '<li>' + inline((ul || ol)[1]) + '</li>'
              continue
            }
            if (t.startsWith('&gt;') || t.startsWith('>')) {
              closeList()
              flushPara()
              out += '<blockquote>' + inline(t.replace(/^>\s?/, '')) + '</blockquote>'
              continue
            }
            if (t.startsWith('|') && t.endsWith('|')) {
              closeList()
              flushPara()
              if (/^\|[\s:|-]+\|$/.test(t)) {
                inTable = true
                continue
              }
              const cells = t.slice(1, -1).split('|').map((c) => inline(c.trim()))
              if (!inTable) {
                out += '<table><thead><tr>' + cells.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>'
                inTable = true
              } else {
                out += '<tr>' + cells.map((c) => '<td>' + c + '</td>').join('') + '</tr>'
              }
              continue
            }
            if (inTable) {
              out += '</tbody></table>'
              inTable = false
            }
            closeList()
            para.push(t)
          }
          closeList()
          flushPara()
          if (inTable) out += '</tbody></table>'
        })
        return out
      }

      // 完成提示仅代表本浏览器尚未查看；持久化后，手机锁屏回来也不会丢失。
      const READ_KEY = 'deva.gateway.read.v1'
      let readMarks = {}
      try { readMarks = JSON.parse(localStorage.getItem(READ_KEY) || '{}') } catch {}
      function markRead(id, completedAt) {
        if (!id) return
        readMarks[id] = Math.max(readMarks[id] || 0, completedAt || 0,
          S.sessions.find(s => s.id === id)?.completedAt || 0, Date.now())
        try { localStorage.setItem(READ_KEY, JSON.stringify(readMarks)) } catch {}
      }
      function isUnread(s) {
        return !s.running && Number(s.completedAt || 0) > Number(readMarks[s.id] || 0)
      }
      let sessionsRequest = null
      const sessionRevisions = new Map()
      let cancelSessionHold = () => {}
      $('#sessionList').addEventListener('scroll', () => cancelSessionHold(), { passive:true })
      $('#sessionList').addEventListener('wheel', () => cancelSessionHold(), { passive:true })
      async function loadSessions() {
        if (sessionsRequest) return sessionsRequest
        sessionsRequest = refreshSessionList()
        try { return await sessionsRequest } finally { sessionsRequest = null }
      }
      async function refreshSessionList() {
        const revisions = new Map(sessionRevisions)
        try {
          const incoming = await api('/api/sessions')
          const current = new Map(S.sessions.map(s => [s.id, s]))
          S.sessions = incoming.map(s => {
            if ((revisions.get(s.id) || 0) === (sessionRevisions.get(s.id) || 0)) return s
            const newer = current.get(s.id)
            return newer ? { ...s, running:newer.running, turnId:newer.turnId,
              startedAt:newer.startedAt, completedAt:newer.completedAt } : s
          })
          if (S.sessionId) S.meta = S.sessions.find(s => s.id === S.sessionId) || S.meta
          renderSessions()
        } catch (e) {
          $('#sessionList').innerHTML = `<div class="empty">读取会话失败<br>${esc(e.message)}</div>`
        }
      }

      function sessionRow(s) {
        const meta = []
        if (s.running) meta.push('<span class="tag">运行中</span>')
        meta.push(`<span>${esc(relTime(s.updatedAt))}</span>`)
        if (s.model) meta.push(`<span>${esc(modelLabel(s.model))}</span>`)
        // 会话行也挂角色头像：列表页一眼就知道每个对话是谁（正在跑的那个底板变星芒）
        const avatar = s.personaId ? avatarHtml(s.personaId, { busy: !!s.running, done: isUnread(s) }) : ''
        // 右上角标角色名：头像之外再给一个明确的文字，扫列表时不用辨认脸
        const roleTag = s.personaId
          ? `<span class="srow__role">${esc(personaName(s.personaId))}</span>`
          : ''
        return `<div class="srow" data-id="${esc(s.id)}">
          ${avatar}
          <div class="srow__body">
            <div class="srow__head">
              <div class="srow__title">${esc(s.title || '未命名对话')}</div>
              ${roleTag}
            </div>
            <div class="srow__meta">${meta.join('<span class="sep">·</span>')}</div>
            ${s.focusRoot ? `<div class="srow__focus">⌂ ${esc(s.focusRoot)}</div>` : ''}
          </div>
        </div>`
      }

      function renderSessions() {
        const active = S.sessions.filter((s) => !s.archived)
        const archived = S.sessions.filter((s) => s.archived)
        let h = ''
        if (!active.length && !archived.length) {
          h = '<div class="empty">还没有对话<br>点右上角 ＋ 新建一个</div>'
        } else {
          if (active.length) h += '<div class="list-group">对话</div>' + active.map(sessionRow).join('')
          if (archived.length) h += '<div class="list-group">已归档</div>' + archived.map(sessionRow).join('')
        }
        $('#sessionList').innerHTML = h
        for (const el of document.querySelectorAll('.srow')) bindSessionRow(el)
        hydrateAvatars()
      }

      let contextSession = null
      function showSessionMenu(id) {
        contextSession = S.sessions.find(s => s.id === id)
        if (!contextSession) return
        $('#ctxTitle').textContent = contextSession.title || '未命名对话'
        $('#ctxArchiveText').textContent = contextSession.archived ? '移回对话列表' : '归档对话'
        const del = $('#ctxMenu [data-act="delete"]')
        del.disabled = !!contextSession.running
        del.title = contextSession.running ? '请先停止正在运行的任务' : ''
        $('#ctxMenu').classList.add('is-open')
      }
      function bindSessionRow(el) {
        let timer, origin, held = false
        const cancel = () => { clearTimeout(timer); timer = null }
        el.onpointerdown = e => {
          if (e.button !== 0) return
          cancelSessionHold()
          cancelSessionHold = cancel
          origin = { x:e.clientX, y:e.clientY }
          held = false
          timer = setTimeout(() => { held = true; showSessionMenu(el.dataset.id) }, 550)
        }
        el.onpointermove = e => {
          if (origin && Math.hypot(e.clientX-origin.x, e.clientY-origin.y) > 10) cancel()
        }
        el.onpointerup = cancel
        el.onpointercancel = cancel
        el.oncontextmenu = e => { e.preventDefault(); cancel(); held = true; showSessionMenu(el.dataset.id) }
        el.onclick = e => {
          if (held) { e.preventDefault(); held = false; return }
          openSession(el.dataset.id)
        }
      }
      $('#ctxMenu').onclick = async e => {
        const button = e.target.closest('[data-act]')
        if (!button) {
          if (e.target === $('#ctxMenu')) $('#ctxMenu').classList.remove('is-open')
          return
        }
        const act = button.dataset.act
        const s = contextSession
        $('#ctxMenu').classList.remove('is-open')
        if (!s) return

        // 新建对话：不依赖具体会话，直接开新的
        if (act === 'new') return openNewSheet()
        if (act === 'rename') return openRenameSheet(s)
        if (act === 'delete' && !confirm('删除后该对话的所有消息将被永久移除，无法恢复。')) return
        try {
          await api(act === 'archive' ? '/api/archive' : '/api/delete',
            act === 'archive' ? { sessionId:s.id, archived:!s.archived } : { sessionId:s.id })
          if (act === 'delete' && S.sessionId === s.id) backToList()
          await loadSessions()
          toast(act === 'delete' ? '对话已删除' : s.archived ? '已移回对话列表' : '已归档')
        } catch (err) { toast(err.message) }
      }

      /** 重命名对话：留空则恢复默认标题（照桌面端 renamePlaceholder）。 */
      let renameTarget = null
      function openRenameSheet(s) {
        renameTarget = s
        $('#renameInput').value = s.title || ''
        openSheet('#renameSheet')
        setTimeout(() => $('#renameInput').focus(), 50)
      }
      $('#renameOk').onclick = async () => {
        if (!renameTarget) return
        const title = $('#renameInput').value.trim()
        closeSheets()
        try {
          await api('/api/rename', { sessionId: renameTarget.id, title })
          if (S.sessionId === renameTarget.id && S.meta) S.meta.title = title
          await loadSessions()
          updateHeader()
          toast('已重命名')
        } catch (e) { toast(e.message) }
      }
      $('#renameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); $('#renameOk').click() }
      })

      // ───────── 视图切换 ─────────
      const isWide = () => window.matchMedia('(min-width: 900px)').matches

      function syncLayout() {
        const wide = isWide()
        if (wide) {
          $('#sidebar').hidden = false
          $('#main').hidden = !S.sessionId
          $('#backBtn').hidden = true
        } else {
          const inChat = S.view === 'chat' && !!S.sessionId
          $('#sidebar').hidden = inChat
          $('#main').hidden = !inChat
          $('#backBtn').hidden = !inChat
        }
      }

      function pushHistory() {
        if (window.history.state?.deva) return
        window.history.pushState({ deva: true }, '')
      }

      // ───────── 会话 ─────────
      async function openSession(id) {
        S.__pendingTurn = null
        const version = ++currentRequest
        const observed = lastStreamAt
        S.sessionId = id
        S.meta = S.sessions.find((s) => s.id === id) || null
        S.messages = []
        S.live = null
        S.turnId = null
        S.inserts = []
        S.view = 'chat'
        renderComposer()
        pushHistory()
        syncLayout()
        $('#threadInner').innerHTML = '<div class="status"><span class="spin"></span>载入对话…</div>'
        try {
          // 角色清单先备好（头像要按角色取），失败也不挡着看对话
          await ensureMeta().catch(() => {})
          const r = await api('/api/session?id=' + encodeURIComponent(id))
          if (S.sessionId !== id || version !== currentRequest) return
          if (observed !== lastStreamAt) {
            await syncCurrentSession()
            updateHeader()
            return
          }
          const previous = S.messages
          S.messages = (r.messages || []).map((m, i) => {
            const old = previous[i]
            return m.role === 'assistant' && old?.role === 'assistant' && old.foldKey
              ? { ...m, foldKey:old.foldKey } : m
          })
          S.deliverables = r.deliverables || []
          // 服务端快照可能比刚落地的 turn_start 更旧（打开会话/轮询与 SSE 竞争）。
          // 本地已在跑而快照说空闲时，保留本地这一轮，别把运行中的按钮和计时抹掉。
          // 但要认得出「这轮真的结束了」：快照带 completedAt 且晚于本地起轮时间 → 接受快照。
          // 否则（快照纯粹是旧数据）10 分钟内保留本地状态。
          const startedAt = S.live?.startedAt || 0
          const localRunning = S.turnId && S.turnId !== 'pending'
          const finishedPerSnapshot = r.completedAt && (!startedAt || r.completedAt >= startedAt)
          if (localRunning && !r.turnId && !finishedPerSnapshot && startedAt && Date.now() - startedAt < 10 * 60 * 1000) return
          S.turnId = r.turnId || null
          S.__pendingTurn = S.turnId
          S.live = null
          S.inserts = Array.isArray(r.pendingInserts) ? r.pendingInserts.slice() : []
          if (S.turnId) {
            ensureLive()
            for (const e of r.inflight || []) applyEvent(e, true)
            // 中途接进来也要接着算真实起轮时间，而不是从打开这一刻归零
            const live = ensureLive()
            if (!live.startedAt) live.startedAt = Number(r.startedAt || 0) || Date.now()
            // inflight 重放里可能带 inserts：以 /api/session 的快照为准
            S.inserts = Array.isArray(r.pendingInserts) ? r.pendingInserts.slice() : S.inserts
          }
          markRead(id, r.completedAt)
          renderSessions()
          renderThread()
          updateHeader()
          scrollBottom(true)
        } catch (e) {
          $('#threadInner').innerHTML = `<div class="notice notice--error">载入失败：${esc(e.message)}</div>`
        }
      }

      function backToList() {
        S.__pendingTurn = null
        currentRequest++
        S.view = 'list'
        S.sessionId = null
        S.meta = null
        S.messages = []
        S.live = null
        S.turnId = null
        S.inserts = []
        syncLayout()
        updateHeader()
        renderComposer()
        loadSessions()
      }

      /** `providerId:modelId` → 可读模型名（优先用清单里的 name，否则退回模型 id 本身）。 */
      function modelLabel(ref) {
        if (!ref) return '模型'
        const i = ref.indexOf(':')
        if (i < 0) return ref
        const pid = ref.slice(0, i)
        const mid = ref.slice(i + 1)
        for (const p of S.models.providers) {
          if (p.id !== pid) continue
          const m = p.models.find((x) => x.id === mid)
          return m?.name || mid
        }
        return mid
      }

      /** 工具条里用的短名：去掉 `group/` 这类分组前缀，只留最后一段。 */
      /**
       * 工具条里显示的模型名。
       *
       * 桌面端保留名字开头、宽度不够截尾巴（省略号在右），这样 `deepseek-flash` 不会被截成
       * 看不出是哪个模型的样子。所以这里不再取路径最后一段，而是整名显示、交给 CSS 控制截断。
       */
      function modelShort(ref) {
        return modelLabel(ref)
      }

      function updateHeader() {
        if (S.view === 'chat' && S.meta) {
          $('#titleText').textContent = S.meta.title || '对话'
          const bits = []
          if (S.meta.model) bits.push(modelLabel(S.meta.model))
          if (S.meta.focusRoot) bits.push(S.meta.focusRoot)
          $('#subText').textContent = bits.join(' · ')
          updateChips()
        } else {
          $('#titleText').textContent = 'Deva'
          $('#subText').textContent = S.sessions.filter((s) => !s.archived).length
            ? `${S.sessions.filter((s) => !s.archived).length} 个对话`
            : ''
        }
      }

      // ───────── 角色头像 ─────────
      // 头像来自 Deva 自己的 Humation 引擎（同 seed 恒同一张脸），网关只做转发。
      // 底板按 Deva 的规则自己画：闲置是圆，生成中是八角星芒。
      //
      // 坐标系坑（踩过）：头像 SVG 的 viewBox 是 "4 12 72 72"，底板圆心在 (40,48)、半径 36，
      // 不是 100 方框里的 (50,50)。所以形状必须按这个真实坐标系生成，否则人物和底板错位（person 偏左）。
      const avatarCache = new Map()
      const avatarRequests = new Map()
      let avatarInstance = 0
      const BURST_N = 200
      const AVA_CX = 40
      const AVA_CY = 48
      const AVA_R = 36

      /** 圆底板（同原图 geometry）。 */
      const CIRCLE_D = `M${AVA_CX} ${AVA_CY - AVA_R}A${AVA_R} ${AVA_R} 0 1 1 ${AVA_CX} ${AVA_CY + AVA_R}A${AVA_R} ${AVA_R} 0 1 1 ${AVA_CX} ${AVA_CY - AVA_R}Z`

      /**
       * 星芒底板。
       * 半径函数照抄 humation.tsx 的 burstR(t)（100 方框下的 41.5 + 8.5·((1+cos8t)/2)^1.4），
       * 按最大半径 50 → AVA_R 缩放，星芒尖角不会撑大原头像。
       */
      function burstPathD() {
        const base = 50
        const k = AVA_R / base
        const pts = []
        for (let i = 0; i < BURST_N; i++) {
          const t = (i / BURST_N) * Math.PI * 2
          const r = (41.5 + 8.5 * Math.pow((1 + Math.cos(8 * t)) / 2, 1.4)) * k
          pts.push(`${(AVA_CX + r * Math.sin(t)).toFixed(2)} ${(AVA_CY - r * Math.cos(t)).toFixed(2)}`)
        }
        return 'M' + pts.join('L') + 'Z'
      }
      const BURST_D = burstPathD()

      /**
       * 把头像一个整体拼出来：底板（圆/星芒）+ 人物层。
       * 生成头像我拿到的是一整张 SVG，里面的底板 path 得换成能变形的这一条，
       * 人物层靠它自己的 clipPath 跟随底板，所以两者必须同形——这也是把 plateD 单独要过来的原因。
       */
      function avatarMarkup(data, busy) {
        if (typeof data === 'string') {
          // 自定义头像：就是一张图，跟着容器裁成圆形
          return `<img class="ava__img" src="${data}" alt="">`
        }
        if (!data || !data.svg) return ''
        const d = busy ? BURST_D : CIRCLE_D
        const tmp = document.createElement('div')
        tmp.innerHTML = data.svg
        const el = tmp.firstElementChild
        if (!el) return ''
        // 第一枚实心顶层 path 是底板：换成目标形状，呼吸动画仅作用于它。
        const plate = [...el.querySelectorAll(':scope > path')].find(
          (x) => (x.getAttribute('fill') || '').toLowerCase() !== 'none'
        )
        if (plate) {
          plate.setAttribute('d', d)
          plate.classList.add('ava__plate')
        }
        // 描边环（fill=none 的顶层 path）跟着同形；它不转，免得出现两圈错位的边
        for (const ring of el.querySelectorAll(':scope > path[fill="none"]')) ring.setAttribute('d', d)
        // 保持人物层原来的构图；每枚 SVG 独享裁切 ID，避免列表中的星芒影响对话中的圆形头像。
        for (const p of el.querySelectorAll('clipPath path')) {
          if (!data.plateD || p.getAttribute('d') === data.plateD) p.setAttribute('d', CIRCLE_D)
        }
        // 保留头部/身体的原始分层遮罩；对话外轮廓由 .msg .ava 圆形裁切保证。
        const prefix = 'ava-' + (++avatarInstance) + '-'
        const ids = new Map([...el.querySelectorAll('[id]')].map(n => [n.id, prefix + n.id]))
        for (const n of el.querySelectorAll('*')) {
          for (const a of [...n.attributes]) {
            let value = a.value
            if (a.name === 'id') value = ids.get(value) || value
            else for (const [oldId, newId] of ids) {
              value = value.split('url(#' + oldId + ')').join('url(#' + newId + ')')
              if (value === '#' + oldId) value = '#' + newId
            }
            n.setAttribute(a.name, value)
          }
        }
        return el.outerHTML
      }

      function personaOf(sessionId) {
        const meta = S.sessions.find((x) => x.id === sessionId)
        return meta?.personaId || S.meta?.personaId || ''
      }

      /** 角色显示名：清单没加载时先退回 id，头像不受影响（服务端按 id 也能查）。 */
      function personaName(pid) {
        const p = S.personas.find((x) => x.id === pid)
        return p?.name || 'Deva'
      }
