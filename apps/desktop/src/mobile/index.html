<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 外观（见 theme.ts）：渲染前先按保存的选择 / 系统深浅色设好，打开时不闪白底。
      ;(function () {
        var p = null
        try {
          p = localStorage.getItem('deva.pref.theme')
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        // 从主屏幕打开：启动底层（#boot）在时状态栏同启动画面的紫色，页面渲染好后由 theme.ts 改回。
        var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true
        document.querySelector('meta[name="theme-color"]').setAttribute('content', standalone ? '#6540e9' : dark ? '#1e1e20' : '#ffffff')
      })()
    </script>
    <style>
      /* 启动底层：与安卓启动画面（manifest 的 background_color + icon-maskable-512.png）同色、标志同大小，
         从主屏幕打开时接住启动画面，页面渲染好后淡出（splash.ts）。浏览器标签页里不显示。 */
      #boot { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; background: #6540e9; transition: opacity 0.22s ease; }
      #boot svg { width: min(33vw, 200px); height: auto; }
      #boot.is-out { opacity: 0; pointer-events: none; }
      @media (display-mode: standalone) { #boot { display: flex; } }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deva" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <!-- 不写 start_url：添加到主屏幕时保存的是当前地址（含安装票据），主屏幕图标首次打开时用它换凭证。 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Deva</title>
  </head>
  <body>
    <!-- 标志「!D」同 apps/desktop/build/icon.svg；viewBox 只框住标志本身（1024 坐标里的外接框）。 -->
    <div id="boot" aria-hidden="true">
      <svg viewBox="285 246 454 532" fill="#fff">
        <g transform="translate(-27 -26)">
          <rect x="312" y="272" width="96" height="380" rx="48" />
          <circle cx="360" cy="756" r="48" />
          <path d="M468 320 H500 A218 218 0 0 1 500 756 H468" fill="none" stroke="#fff" stroke-width="96" stroke-linejoin="round" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
